<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORN · Stock Command</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #07090f;
  --surface:  #0d1117;
  --surface2: #111827;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.12);
  --text:     #e2e8f0;
  --muted:    #4b5563;
  --green:    #00e676;
  --green-dim:#003d1e;
  --red:      #ff1744;
  --red-dim:  #3d0008;
  --amber:    #ffab00;
  --amber-dim:#3d2900;
  --blue:     #2979ff;
  --blue-dim: #001040;
  --cyan:     #00e5ff;
  --white:    #ffffff;
  --chart-h:  220px;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  display: flex;
  flex-direction: column;
}

/* ── TOP BAR ──────────────────────────────── */
.topbar {
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border2);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 20px;
  flex-shrink: 0;
  z-index: 10;
}
.brand {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 2px;
  white-space: nowrap;
}
.brand span { color: var(--green); }
.topbar-clock {
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  color: var(--amber);
  letter-spacing: 1px;
  margin-left: auto;
  white-space: nowrap;
}
.tz-toggle {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--cyan);
  background: rgba(0,229,255,0.08);
  border: 1px solid rgba(0,229,255,0.3);
  border-radius: 3px;
  padding: 2px 8px;
  cursor: pointer;
  margin-left: 12px;
  letter-spacing: 1px;
  white-space: nowrap;
}
.tz-toggle:hover { background: rgba(0,229,255,0.18); }
.topbar-refresh {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.refresh-dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  margin-right: 5px;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }

/* ── LAYOUT ───────────────────────────────── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ──────────────────────────────── */
.sidebar {
  width: 240px;
  min-width: 240px;
  background: var(--surface);
  border-right: 1px solid var(--border2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width .2s ease, min-width .2s ease;
  flex-shrink: 0;
}
.sidebar.collapsed {
  width: 0;
  min-width: 0;
  border-right: none;
}
.sidebar-toggle {
  position: absolute;
  top: 60px;
  left: 0;
  z-index: 50;
  width: 22px;
  height: 44px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-left: none;
  border-radius: 0 6px 6px 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--muted);
  transition: left .2s ease, color .15s;
}
.sidebar-toggle:hover { color: var(--text); }
.sidebar.collapsed ~ .sidebar-toggle,
.sidebar-toggle.open { left: 240px; }
.sidebar.collapsed ~ * .sidebar-toggle { left: 0; }

@media (max-width: 768px) {
  .sidebar { width: 0; min-width: 0; border-right: none; }
  .sidebar.open { width: 240px; min-width: 240px; border-right: 1px solid var(--border2); position: absolute; top: 52px; bottom: 0; z-index: 100; }
  .sidebar-toggle { top: 60px; }
  .sidebar.open ~ .sidebar-toggle { left: 240px; }
}
.sb-head {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.cats {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.cat {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  padding: 3px 9px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  color: var(--muted);
  background: transparent;
  cursor: pointer;
  transition: all .15s;
}
.cat:hover { color: var(--text); border-color: rgba(255,255,255,.25); }
.cat.on { color: var(--bg); background: var(--white); border-color: var(--white); }

.sb-scroll { flex:1; overflow-y:auto; padding: 8px 0; }
.sb-scroll::-webkit-scrollbar { width: 3px; }
.sb-scroll::-webkit-scrollbar-thumb { background: var(--border2); }

.cc-group { margin-bottom: 2px; }
.cc-hdr {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .5px;
  color: var(--muted);
  text-transform: uppercase;
  transition: color .1s;
  user-select: none;
}
.cc-hdr:hover { color: var(--text); }
.cc-flag { font-size: 16px; }
.cc-ft { font-size: 11px; font-weight: 400; margin-left: auto; color: var(--muted); font-family: 'Space Mono', monospace; }
.cc-arrow { font-size: 9px; transition: transform .15s; color: var(--muted); }
.cc-arrow.open { transform: rotate(90deg); }

.item-list { padding: 2px 8px 4px 20px; }
.item-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 5px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  color: rgba(226,232,240,.6);
  transition: all .1s;
}
.item-row:hover { background: var(--surface2); color: var(--text); }
.item-row.active { color: var(--text); }
.chk {
  width: 16px; height: 16px;
  border-radius: 4px;
  border: 1.5px solid var(--border2);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  transition: all .1s;
}
.chk.on { background: var(--green); border-color: var(--green); color: var(--bg); }

/* ── CHARTS AREA ──────────────────────────── */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  background: var(--bg);
}
.main::-webkit-scrollbar { width: 5px; }
.main::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 12px;
  color: var(--muted);
  text-align: center;
}
.empty-state .empty-icon { font-size: 48px; opacity: .3; margin-bottom: 8px; }
.empty-state h2 { font-size: 22px; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,.15); }
.empty-state p { font-size: 14px; color: var(--muted); line-height: 1.6; }

/* ── CARD ─────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 16px;
  overflow: hidden;
  transition: border-color .2s;
}
.card.fly  { border-color: rgba(0,230,118,.3); }
.card.skip { border-color: rgba(255,23,68,.2); }
.card.wait { border-color: rgba(255,171,0,.25); }

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 16px 20px 12px;
  gap: 12px;
}
.card-close {
  font-size: 14px;
  color: rgba(255,255,255,0.2);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0 0 0 6px;
  line-height: 1;
  flex-shrink: 0;
  margin-top: 2px;
}
.card-close:hover { color: var(--red); }
.clear-all {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: rgba(255,255,255,0.3);
  background: transparent;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 3px;
  padding: 2px 8px;
  cursor: pointer;
  margin-left: 10px;
  letter-spacing: 1px;
}
.clear-all:hover { color: var(--red); border-color: var(--red); }
.card-name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .5px;
  color: var(--white);
  line-height: 1.2;
}
.card-sub {
  font-size: 13px;
  color: var(--muted);
  margin-top: 3px;
  font-family: 'Space Mono', monospace;
  letter-spacing: .5px;
}

.decision {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  padding: 6px 14px;
  border-radius: 4px;
  border: 1.5px solid;
  white-space: nowrap;
  flex-shrink: 0;
}
.decision.fly  { color: var(--green); border-color: var(--green); background: var(--green-dim); }
.decision.skip { color: var(--red);   border-color: var(--red);   background: var(--red-dim); }
.decision.wait { color: var(--amber); border-color: var(--amber); background: var(--amber-dim); }
.decision.none { color: var(--muted); border-color: var(--muted); background: transparent; }

/* Stats row */
.stats {
  display: flex;
  gap: 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.stat {
  flex: 1;
  padding: 10px 16px;
  border-right: 1px solid var(--border);
}
.stat:last-child { border-right: none; }
.stat-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 3px;
}
.stat-value {
  font-family: 'Space Mono', monospace;
  font-size: 16px;
  font-weight: 700;
  color: var(--white);
}
.stat-value.green { color: var(--green); }
.stat-value.red   { color: var(--red); }
.stat-value.amber { color: var(--amber); }
.stat-value.blue  { color: var(--cyan); }

/* Reason */
.reason {
  padding: 9px 20px;
  font-size: 13px;
  color: rgba(226,232,240,.55);
  border-bottom: 1px solid var(--border);
  letter-spacing: .3px;
  font-family: 'Space Mono', monospace;
  line-height: 1.5;
}

/* Chart */
.chart-section { padding: 16px 20px 20px; }
.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.chart-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
}
.win-selector { display: flex; gap: 4px; }
.win-btn {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  padding: 2px 7px;
  border-radius: 3px;
  border: 1px solid rgba(255,255,255,0.12);
  background: transparent;
  color: rgba(255,255,255,0.3);
  cursor: pointer;
  letter-spacing: 1px;
}
.win-btn:hover { border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.6); }
.win-btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(0,229,255,0.08); }
.chart-wrap { position: relative; }
.view-toggle { display: flex; gap: 4px; }
.view-btn {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  padding: 2px 7px;
  border-radius: 3px;
  border: 1px solid rgba(255,255,255,0.12);
  background: transparent;
  color: rgba(255,255,255,0.3);
  cursor: pointer;
  letter-spacing: 1px;
}
.view-btn:hover { border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.6); }
.view-btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(0,229,255,0.08); }
canvas {
  display: block;
  width: 100%;
  height: var(--chart-h);
  border-radius: 6px;
  background: var(--bg);
}

/* Legend */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 10px;
}
.leg {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .5px;
}
.leg-line {
  width: 20px; height: 2px;
  border-radius: 1px;
  flex-shrink: 0;
}
.leg-dash {
  width: 20px; height: 2px;
  flex-shrink: 0;
  border-top: 2px dashed;
}

/* Confidence bar */
.conf {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px 14px;
  border-top: 1px solid var(--border);
}
.conf-label { font-size: 11px; font-weight:700; letter-spacing:1.5px; color: var(--muted); white-space:nowrap; }
.conf-track { flex:1; height:4px; background: rgba(255,255,255,.07); border-radius:2px; overflow:hidden; }
.conf-fill { height:100%; border-radius:2px; transition: width .5s ease; }
.conf-pct { font-family:'Space Mono',monospace; font-size:12px; color:var(--white); white-space:nowrap; }

/* Progress bar at bottom */
.progress-bar {
  height: 3px;
  background: var(--surface);
  flex-shrink: 0;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--cyan));
  transition: width 1s linear;
}
</style>
</head>

             'Harpoon','Cutlass','Machete','MP9','Claymore','Enfield','Minigun','Taurus'];
  if (w.some(x => name.includes(x))) return 'weapon';
  return 'other';
}

// ── Sidebar ──────────────────────────────────────────────────────────────────
function renderSidebar() {
  const sb = document.getElementById('sbScroll');
  sb.innerHTML = '';
  for (const [cc, items] of Object.entries(ITEMS)) {
    const m = CC[cc];
    const vis = items.filter(name => cat === 'all' || getCategory(name) === cat);
    if (!vis.length) continue;
    const open = !collapsed[cc];
    const g = document.createElement('div'); g.className = 'cc-group';
    const h = document.createElement('div'); h.className = 'cc-hdr';
    h.innerHTML = `<span class="cc-arrow ${open?'open':''}">▶</span><span class="cc-flag">${m.flag}</span>${m.n}<span class="cc-ft">${m.ft}m</span>`;
    h.onclick = () => { collapsed[cc]=!collapsed[cc]; save(); renderSidebar(); };
    const rows = document.createElement('div'); rows.className = 'item-list';
    rows.style.display = open ? 'block' : 'none';
    vis.forEach(name => {
      const k = ik(cc, name), on = !!enabled[k];
      const r = document.createElement('div');
      r.className = 'item-row' + (on?' active':'');
      r.innerHTML = `<div class="chk ${on?'on':''}">${on?'✓':''}</div>${name}`;
      r.onclick = () => { enabled[k]=!enabled[k]; save(); renderSidebar(); renderCharts(); };
      rows.appendChild(r);
    });
    g.appendChild(h); g.appendChild(rows); sb.appendChild(g);
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fm(m) {
  if (m === null || m === undefined) return '—';
  m = Math.round(m);
  return m < 60 ? m + 'm' : Math.floor(m/60) + 'h' + (m%60 ? m%60+'m' : '');
}
function fmNum(n) {
  if (n === null || n === undefined) return '—';
  if (n >= 1000) return Math.round(n/100)/10 + 'k';
  return String(Math.round(n));
}

// ── Chart drawing ─────────────────────────────────────────────────────────────
function drawChart(canvas, pred, ft, view) {
  view = view || 'flight';
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth;
  const H = 220;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const PAD  = { top: 24, right: 20, bottom: 40, left: 52 };
  const CW   = W - PAD.left - PAD.right;
  const CH   = H - PAD.top  - PAD.bottom;
  const now  = Date.now();

  const a        = (pred && pred.analysis) || {};
  const interval = a.avgRestockInterval || 60;
  const nw       = pred ? (pred.nextWindowMins || 0) : 0;
  const rawHist  = (pred && pred.rawHistory) || [];

  // ── Window: flight-centric or 12h history ────────────────────────────────
  let TL_PAST, TL_FUTURE;
  if (view === 'history') {
    TL_PAST   = 12 * 60;
    TL_FUTURE = 2  * 60;
  } else {
    TL_PAST   = Math.max(interval, 60);
    TL_FUTURE = Math.max(nw + ft + 3 * interval, ft + interval);
  }
  const TL_TOTAL = TL_PAST + TL_FUTURE;

  const cur        = a.currentStock         || 0;
  const rate       = a.depletionRate        || 0;
  const rst        = pred ? pred.restockEta : null;   // mins from now
  const dur        = a.avgStockDuration     || null;
  const afterRst   = a.avgStockAfterRestock || 800;
  const promCount  = a.promRestockCount     || 0;
  const lnd        = nw + ft;
  const fhist      = (pred && pred.flightHistory)  || [];
  const rhist      = (pred && pred.restockHistory) || [];
  const ho         = pred && pred.hourlyOverride;
  const hoActive   = ho && ho.active;

  // Convert restockHistory timestamps to mins-from-now
  const pastRestocks = rhist
    .map(r => ({ t: (r.ts - now) / 60000, q: afterRst }))
    .filter(r => r.t < 0 && r.t > -TL_PAST);

  // Convert flightHistory to mins-from-now
  const flightEvents = fhist
    .map(f => ({ t: (f.ts - now) / 60000, type: f.type, result: f.result }))
    .filter(f => f.t > -TL_PAST && f.t < TL_FUTURE);

  // Max Y — based on afterRst or cur
  let maxY = Math.max(cur, afterRst, 100);
  pastRestocks.forEach(r => { if (r.q > maxY) maxY = r.q; });
  maxY = maxY * 1.2;

  // Coordinate transforms
  const tx  = t => PAD.left + ((t + TL_PAST) / TL_TOTAL) * CW;
  const ty  = q => PAD.top  + CH - (Math.min(q, maxY) / maxY) * CH;
  const nowX = tx(0);

  // ── Background ───────────────────────────────────────────────────────────────
  ctx.fillStyle = '#07090f';
  ctx.fillRect(0, 0, W, H);

  // Past zone tint
  ctx.fillStyle = 'rgba(255,255,255,0.018)';
  ctx.fillRect(PAD.left, PAD.top, nowX - PAD.left, CH);

  // ── Grid ─────────────────────────────────────────────────────────────────────
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = PAD.top + (i / 4) * CH;
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + CW, y); ctx.stroke();
  }
  // Adaptive vertical grid based on total window
  const gridStep = TL_TOTAL <= 120 ? 10 : TL_TOTAL <= 300 ? 30 : TL_TOTAL <= 600 ? 60 : TL_TOTAL <= 1440 ? 120 : 240;
  for (let t = -TL_PAST; t <= TL_FUTURE; t += gridStep) {
    if (t === 0) continue;
    ctx.beginPath(); ctx.moveTo(tx(t), PAD.top); ctx.lineTo(tx(t), PAD.top + CH); ctx.stroke();
  }

  // ── Flight zone shading ───────────────────────────────────────────────────────
  if (nw < TL_FUTURE) {
    ctx.fillStyle = 'rgba(41,121,255,0.06)';
    ctx.fillRect(tx(nw), PAD.top, tx(Math.min(lnd, TL_FUTURE)) - tx(nw), CH);
  }

  // ── Future restock window shading ─────────────────────────────────────────────
  if (rst !== null && rst > 0 && rst < TL_FUTURE && dur) {
    ctx.fillStyle = 'rgba(0,230,118,0.05)';
    ctx.fillRect(tx(rst), PAD.top, tx(Math.min(rst + dur, TL_FUTURE)) - tx(rst), CH);
  }

  // ── Helper: draw a restock spike ─────────────────────────────────────────────
  function drawSpike(tStart, stockQty, color, alpha, dashed) {
    if (tStart < -TL_PAST || tStart > TL_FUTURE) return;
    const x = tx(tStart);
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 1;
    if (dashed) ctx.setLineDash([3, 3]);

    // Vertical rise
    ctx.beginPath();
    ctx.moveTo(x, ty(0));
    ctx.lineTo(x, ty(stockQty));
    ctx.stroke();

    // Depletion slope only for future predicted spikes (not past history)
    if (!dashed && tStart >= 0 && rate > 0 && dur) {
      ctx.beginPath();
      ctx.moveTo(x, ty(stockQty));
      let t2 = tStart;
      const depEnd = tStart + dur;
      while (t2 <= Math.min(depEnd, TL_FUTURE)) {
        ctx.lineTo(tx(t2), ty(Math.max(0, stockQty - rate * (t2 - tStart))));
        t2 += 5;
      }
      ctx.lineTo(tx(Math.min(depEnd, TL_FUTURE)), ty(0));
      ctx.stroke();
    } else if (!dashed && tStart >= 0 && dur) {
      ctx.beginPath();
      ctx.moveTo(x, ty(stockQty));
      ctx.lineTo(tx(Math.min(tStart + dur, TL_FUTURE)), ty(0));
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Past restock spikes from restockHistory — skipped, raw qty line shows them naturally

  // ── Detect restock events from rawHistory for annotations ────────────────────
  const rawEvts = []; // { t, qty, interval, deplRate }
  if (rawHist.length > 1) {
    let lastRestockT = null, lastRestockQ = null;
    for (let i = 1; i < rawHist.length; i++) {
      const prev = rawHist[i-1], curr = rawHist[i];
      const tCurr = (curr.ts - now) / 60000;
      const tPrev = (prev.ts - now) / 60000;
      if (tCurr < -TL_PAST || tCurr > 0) continue;
      // Restock = stock jumped up by >10%
      if (curr.stock > prev.stock + Math.max(prev.stock * 0.1, 50)) {
        const intervalMins = lastRestockT !== null ? Math.round(tCurr - lastRestockT) : null;
        // Compute depletion rate of PREVIOUS cycle
        let deplRate = null;
        if (lastRestockT !== null && lastRestockQ !== null) {
          // Find lowest stock before this restock
          let minQ = lastRestockQ;
          for (let j = i-1; j >= 0; j--) {
            const tj = (rawHist[j].ts - now) / 60000;
            if (tj < lastRestockT) break;
            minQ = Math.min(minQ, rawHist[j].stock);
          }
          const lost = lastRestockQ - minQ;
          const duration = tCurr - lastRestockT;
          if (duration > 0 && lost > 0) deplRate = Math.round(lost / duration);
        }
        rawEvts.push({ t: tCurr, qty: curr.stock, interval: intervalMins, deplRate });
        lastRestockT = tCurr;
        lastRestockQ = curr.stock;
      }
    }
  }

  // ── Current stock line — real history past + projection future ────────────────
  const linePts = [];

  // Past portion: always use real raw data if available
  if (rawHist.length > 0) {
    rawHist.forEach(r => {
      const t = (r.ts - now) / 60000;
      if (t >= -TL_PAST && t < 0)
        linePts.push({ t, q: r.stock });
    });
  } else if (view === 'flight' && rate > 0 && cur >= 0) {
    // Fallback: extrapolate backward
    const tBack = -Math.min(cur / rate, TL_PAST);
    for (let t = tBack; t <= 0; t += 5)
      linePts.push({ t, q: Math.max(0, cur + rate * (-t)) });
  }

  // NOW point
  linePts.push({ t: 0, q: cur });

  // Future portion: forward projection from cur
  if (cur > 0 && rate > 0) {
    const depAt = cur / rate;
    for (let t = 2; t <= Math.min(depAt, TL_FUTURE); t += 3)
      linePts.push({ t, q: Math.max(0, cur - rate * t) });
    if (depAt < TL_FUTURE) linePts.push({ t: depAt, q: 0 });
  } else if (cur > 0) {
    linePts.push({ t: TL_FUTURE, q: cur });
  } else {
    linePts.push({ t: 1, q: 0 });
  }

  // Fill + line
  if (linePts.length > 1) {
    const grad = ctx.createLinearGradient(0, PAD.top, 0, PAD.top + CH);
    grad.addColorStop(0, 'rgba(0,230,118,0.12)');
    grad.addColorStop(1, 'rgba(0,230,118,0.01)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(tx(linePts[0].t), PAD.top + CH);
    linePts.forEach(p => ctx.lineTo(tx(p.t), ty(p.q)));
    ctx.lineTo(tx(linePts[linePts.length-1].t), PAD.top + CH);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#00e676';
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    linePts.forEach((p, i) => i === 0 ? ctx.moveTo(tx(p.t), ty(p.q)) : ctx.lineTo(tx(p.t), ty(p.q)));
    ctx.stroke();
  }

  // ── Future restock predictions (dashed) — fill TL_FUTURE if real interval known ──
  if (rst !== null && rst > 0 && rst < TL_FUTURE) {
    // First spike: always draw if Prometheus gave us an ETA
    drawSpike(rst, afterRst, '#00e676', 0.55, true);

    // Additional spikes: only if we have real observed interval (promRestockCount >= 2)
    if (interval && promCount >= 2) {
      let n = 1;
      let prevT = rst;
      while (true) {
        const t = rst + interval * n;
        if (t >= TL_FUTURE) break;
        const alpha = Math.max(0.1, 0.45 - n * 0.06);
        drawSpike(t, afterRst, '#00e676', alpha, true);

        // Interval label between spikes — midpoint, above baseline
        const midT = (prevT + t) / 2;
        if (midT < TL_FUTURE) {
          const abs = Math.round(interval);
          const lbl = abs >= 60 ? Math.floor(abs/60)+'h'+(abs%60?abs%60+'m':'') : abs+'m';
          ctx.save();
          ctx.font = '7px "Space Mono",monospace';
          ctx.fillStyle = 'rgba(0,230,118,0.35)';
          ctx.textAlign = 'center';
          ctx.fillText('↔'+lbl, tx(midT), PAD.top + CH - 6);
          ctx.restore();
        }
        prevT = t;
        n++;
      }
    }
  }

  // ── Hourly override badge ─────────────────────────────────────────────────────
  if (hoActive) {
    ctx.save();
    ctx.font = 'bold 7px "Space Mono",monospace';
    const badge = `⏱ H${ho.hour} ${ho.rate}/m`;
    const bw = ctx.measureText(badge).width + 8;
    ctx.fillStyle = 'rgba(0,229,255,0.12)';
    ctx.fillRect(PAD.left + 4, PAD.top + 2, bw, 12);
    ctx.fillStyle = 'rgba(0,229,255,0.7)';
    ctx.textAlign = 'left';
    ctx.fillText(badge, PAD.left + 8, PAD.top + 11);
    ctx.restore();
  }

  // ── NOW dot ───────────────────────────────────────────────────────────────────
  ctx.fillStyle = '#00e676';
  ctx.beginPath(); ctx.arc(tx(0), ty(cur), 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#07090f';
  ctx.beginPath(); ctx.arc(tx(0), ty(cur), 2, 0, Math.PI*2); ctx.fill();

  // ── Stock qty label ───────────────────────────────────────────────────────────
  if (cur > 0) {
    ctx.font = '9px "Space Mono", monospace';
    ctx.fillStyle = '#00e676';
    ctx.textAlign = 'left';
    ctx.fillText(fmNum(cur), tx(0) + 6, ty(cur) - 4);
  }

  // ── Restock event annotations ────────────────────────────────────────────────
  rawEvts.forEach((evt, idx) => {
    const x = tx(evt.t);
    ctx.save();
    ctx.font = '7px "Space Mono",monospace';
    ctx.textAlign = 'center';

    // Interval label above spike
    if (evt.interval !== null) {
      const abs = Math.abs(evt.interval);
      const lbl = abs >= 60 ? Math.floor(abs/60)+'h'+(abs%60?abs%60+'m':'') : abs+'m';
      ctx.fillStyle = 'rgba(0,230,118,0.5)';
      ctx.fillText('↑'+lbl, x, ty(evt.qty) - 6);
    }

    // Depletion rate label — midpoint of previous depletion slope
    if (evt.deplRate !== null && idx > 0) {
      const prevEvt = rawEvts[idx-1];
      const midT = (prevEvt.t + evt.t) / 2;
      const midQ = Math.max(0, prevEvt.qty - evt.deplRate * (midT - prevEvt.t));
      if (midT >= -TL_PAST && midT <= 0) {
        ctx.fillStyle = 'rgba(0,230,118,0.35)';
        ctx.fillText('▼'+evt.deplRate+'/m', tx(midT), ty(midQ) - 6);
      }
    }
    ctx.restore();
  });

  // Current depletion rate annotation on live slope
  if (cur > 0 && rate > 0) {
    ctx.save();
    ctx.font = '7px "Space Mono",monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(0,230,118,0.45)';
    ctx.fillText('▼'+Math.round(rate)+'/m', tx(0) + 8, ty(cur/2) - 4);
    ctx.restore();
  }

  // ── Flight event arrows ───────────────────────────────────────────────────────
  flightEvents.forEach(f => {
    const x = tx(f.t);
    if (x < PAD.left || x > PAD.left + CW) return;
    ctx.save();
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    if (f.type === 'depart') {
      // ▲ cyan — departed
      ctx.fillStyle = 'rgba(0,229,255,0.7)';
      ctx.fillText('▲', x, PAD.top + CH - 4);
      // small vertical line
      ctx.strokeStyle = 'rgba(0,229,255,0.3)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2,3]);
      ctx.beginPath(); ctx.moveTo(x, PAD.top); ctx.lineTo(x, PAD.top+CH-14); ctx.stroke();
      ctx.setLineDash([]);
    } else if (f.type === 'arrive') {
      const col = f.result === 'bought' ? 'rgba(0,230,118,0.8)' : 'rgba(255,23,68,0.7)';
      ctx.fillStyle = col;
      ctx.fillText('▼', x, PAD.top + 14);
      ctx.strokeStyle = col.replace('0.8','0.25').replace('0.7','0.25');
      ctx.lineWidth = 1;
      ctx.setLineDash([2,3]);
      ctx.beginPath(); ctx.moveTo(x, PAD.top+16); ctx.lineTo(x, PAD.top+CH); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  });

  // ── Vertical markers (NOW, DEP, LND, RST) ────────────────────────────────────
  function vline(t, color, label, row, dashed) {
    if (t < -TL_PAST || t > TL_FUTURE) return;
    const x = tx(t);
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    if (dashed) ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(x, PAD.top); ctx.lineTo(x, PAD.top+CH); ctx.stroke();
    ctx.setLineDash([]);
    // Label pill — top of chart, row 1=near top, row 2=below row 1
    ctx.font = 'bold 8px "Space Mono",monospace';
    ctx.textAlign = 'center';
    const tw = ctx.measureText(label).width + 8;
    const lx = Math.max(PAD.left + tw/2, Math.min(PAD.left+CW-tw/2, x));
    const ly = PAD.top + (row === 2 ? 16 : 2);
    ctx.fillStyle = color;
    ctx.fillRect(lx-tw/2, ly, tw, 13);
    ctx.fillStyle = '#07090f';
    ctx.fillText(label, lx, ly+10);
    ctx.restore();
  }

  const predFly = pred && pred.fly;
  const depNow = nw === 0 && predFly === true;
  vline(0, depNow ? '#00e5ff' : 'rgba(255,255,255,0.6)', depNow ? 'DEP NOW' : 'NOW', 1, true);
  if (nw > 0 && nw < TL_FUTURE) vline(nw, '#2979ff', 'DEP '+fm(nw), 2, false);
  if (lnd < TL_FUTURE) vline(lnd, '#00e5ff', 'LND '+fm(lnd), nw > 0 ? 1 : 2, false);
  if (rst!=null&&rst>0&&rst<TL_FUTURE) vline(rst,'#00e676','RST '+fm(rst), rst>30?1:2, true);

  // ── Axes ─────────────────────────────────────────────────────────────────────
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(PAD.left, PAD.top); ctx.lineTo(PAD.left, PAD.top+CH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PAD.left, PAD.top+CH); ctx.lineTo(PAD.left+CW, PAD.top+CH); ctx.stroke();

  // Y labels
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.font = '8px "Space Mono",monospace';
  ctx.textAlign = 'right';
  for (let i=0; i<=4; i++) {
    const q = Math.round(maxY*(1-i/4));
    ctx.fillText(fmNum(q), PAD.left-5, PAD.top+(i/4)*CH+4);
  }

  // X labels — relative minutes from NOW
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.font = '8px "Space Mono",monospace';
  for (let t = -TL_PAST; t <= TL_FUTURE; t += gridStep) {
    if (t === 0) continue;
    const abs = Math.abs(t);
    const lbl = (t < 0 ? '-' : '+') + (abs >= 60 ? Math.floor(abs/60)+'h'+(abs%60?abs%60+'m':'') : abs+'m');
    ctx.fillText(lbl, tx(t), PAD.top + CH + 12);
  }
  // NOW label
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText('NOW', tx(0), PAD.top + CH + 12);
}

// ── Card builder ──────────────────────────────────────────────────────────────
function buildCard(cc, name, pred) {
  const m   = CC[cc];
  const a   = (pred && pred.analysis) || {};
  const fly = pred && pred.fly;
  const nw  = pred ? pred.nextWindowMins : null;
  const rst = pred ? pred.restockEta : null;
  const conf = (pred && pred.confidence) || 0;
  const cp = Math.round(conf * 100);
  const price = pred && pred.buyPrice ? '$' + pred.buyPrice.toLocaleString() : '—';

  let decCls, decTxt;
  if (!pred)          { decCls = 'none'; decTxt = 'LOADING'; }
  else if (fly===true){ decCls = 'fly';  decTxt = '▶  FLY'; }
  else if (nw > 0)    { decCls = 'wait'; decTxt = `DEPART IN ${fm(nw)}`; }
  else if (fly===false){ decCls = 'skip'; decTxt = '■  SKIP'; }
  else                { decCls = 'none'; decTxt = 'NO DATA'; }

  const cfColor = cp > 70 ? '#00e676' : cp > 40 ? '#ffab00' : '#ff1744';
  // Use deterministic canvas ID based on cc+name
  const cid = 'cv_' + cc + '_' + name.replace(/[^a-zA-Z0-9]/g, '_');

  const stockColor = a.currentStock > 0 ? 'green' : 'red';
  const nwColor    = fly === true ? 'green' : (nw > 0 ? 'amber' : '');
  const nwDisplay  = fly === true && (nw === 0 || nw === null) ? 'NOW'
                   : fly === false && (nw === 0 || nw === null) ? '—'
                   : nw > 0 ? fm(nw) : '—';
  const rstColor   = rst !== null && rst < (m.ft + 30) ? 'amber' : '';
  const ho         = pred && pred.hourlyOverride;
  const hoActive   = ho && ho.active;
  const stockLasts = hoActive && ho.duration ? ho.duration : a.avgStockDuration;
  const stockLastsLabel = hoActive ? `Stock Lasts <span style="font-size:8px;color:var(--cyan);letter-spacing:1px">⏱H${ho.hour}</span>` : 'Stock Lasts';

  return `<div class="card ${decCls}" data-cc="${cc}" data-name="${name.replace(/"/g,'&quot;')}">
  <div class="card-top">
    <div class="card-meta">
      <div class="card-name">${name}</div>
      <div class="card-sub">${m.flag} ${m.n} &nbsp;·&nbsp; ${m.ft}m flight &nbsp;·&nbsp; ${price}</div>
    </div>
    <div class="decision ${decCls}">${decTxt}</div>
    <button class="card-close" title="Remove" onclick="removeCard('${cc}','${name.replace(/'/g,"\\'")}')">✕</button>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-label">Stock Now</div>
      <div class="stat-value ${stockColor}">${fmNum(a.currentStock)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Buy Price</div>
      <div class="stat-value">${price}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Restock In</div>
      <div class="stat-value ${rstColor}">${fm(rst)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Next Depart</div>
      <div class="stat-value ${nwColor}">${nwDisplay}</div>
    </div>
    <div class="stat">
      <div class="stat-label">${stockLastsLabel}</div>
      <div class="stat-value${hoActive ? ' style="color:var(--cyan)"' : ''}">${fm(stockLasts)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Interval ${a.intervalSource === 'qty' ? '<span style="font-size:8px;color:var(--amber);letter-spacing:1px">QTY</span>' : a.intervalSource === 'prom' ? '<span style="font-size:8px;color:rgba(0,230,118,0.6);letter-spacing:1px">PRM</span>' : ''}</div>
      <div class="stat-value">${fm(a.avgRestockInterval)}</div>
    </div>
  </div>
  <div class="reason">${pred ? (pred.reason || '—') : 'Fetching data...'}</div>
  <div class="chart-section">
    <div class="chart-header">
      <div class="chart-label">STOCK TIMELINE</div>
      <div class="view-toggle">
        <button class="view-btn${(cardView[ik(cc,name)]||'flight')==='flight' ? ' active' : ''}" onclick="setView('${cc}','${name.replace(/'/g,"\\'")}','flight')">FLIGHT</button>
        <button class="view-btn${cardView[ik(cc,name)]==='history' ? ' active' : ''}" onclick="setView('${cc}','${name.replace(/'/g,"\\'")}','history')">12H</button>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="${cid}" style="height:220px"></canvas>
    </div>
    <div class="legend">
      <div class="leg"><div class="leg-line" style="background:#00e676"></div>Current stock</div>
      <div class="leg"><div class="leg-dash" style="border-color:rgba(0,230,118,.5)"></div>Predicted restock</div>
      <div class="leg"><div class="leg-line" style="background:rgba(255,255,255,.5)"></div>NOW</div>
      <div class="leg"><div class="leg-line" style="background:#2979ff"></div>Depart</div>
      <div class="leg"><div class="leg-line" style="background:#00e5ff"></div>Land</div>
      <div class="leg"><span style="color:rgba(0,229,255,.7);font-size:10px">▲</span>&nbsp;Flight out</div>
      <div class="leg"><span style="color:rgba(0,230,118,.8);font-size:10px">▼</span>&nbsp;Bought</div>
      <div class="leg"><span style="color:rgba(255,23,68,.7);font-size:10px">▼</span>&nbsp;Empty</div>
    </div>
  </div>
  <div class="conf">
    <div class="conf-label">CONFIDENCE</div>
    <div class="conf-track"><div class="conf-fill" style="width:${cp}%;background:${cfColor}"></div></div>
    <div class="conf-pct">${cp}%</div>
  </div>
</div>`;
}

function showEmpty() {
  const main = document.getElementById('main');
  main.innerHTML = `<div class="empty-state">
    <div class="empty-icon">📈</div>
    <h2>NO ITEMS SELECTED</h2>
    <p>Tick any item on the left<br>to start tracking</p>
  </div>`;
}

function removeCard(cc, name) {
  enabled[ik(cc, name)] = false;
  save();
  renderSidebar();
  renderCharts();
}

function clearAll() {
  Object.keys(enabled).forEach(k => enabled[k] = false);
  save();
  renderSidebar();
  renderCharts();
}

function setView(cc, name, mode) {
  const k = ik(cc, name);
  cardView[k] = mode;
  const cards = document.querySelectorAll('.card');
  cards.forEach(card => {
    if (card.dataset.cc === cc && card.dataset.name === name) {
      card.querySelectorAll('.view-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === (mode === 'flight' ? 'FLIGHT' : '12H'));
      });
      const cv = card.querySelector('canvas');
      if (cv) requestAnimationFrame(() => drawChart(cv, cache[k] || null, CC[cc].ft, mode));
    }
  });
}

function drawAllCharts() {
  const main = document.getElementById('main');
  main.querySelectorAll('.card').forEach(card => {
    const cc   = card.dataset.cc;
    const name = card.dataset.name;
    if (!cc || !name) return;
    const cv = card.querySelector('canvas');
    if (!cv) return;
    const pred = cache[ik(cc, name)] || null;
    const view = cardView[ik(cc, name)] || 'flight';
    requestAnimationFrame(() => drawChart(cv, pred, CC[cc].ft, view));
  });
}

// ── Render charts ─────────────────────────────────────────────────────────────
async function renderCharts() {
  const active = Object.entries(enabled)
    .filter(([,v]) => v)
    .map(([k]) => { const i = k.indexOf('|'); return { cc: k.slice(0,i), name: k.slice(i+1) }; });

  if (!active.length) { showEmpty(); return; }
  const main = document.getElementById('main');
  // Render with cached data
  main.innerHTML = active.map(({cc,name}) => buildCard(cc, name, cache[ik(cc,name)] || null)).join('');
  drawAllCharts();

  // Fetch fresh data in parallel
  await Promise.all(active.map(async ({cc, name}) => {
    try {
      const r = await fetch(`${PRED}?token=${TOKEN}&cc=${cc}&item=${encodeURIComponent(name)}`);
      if (r.ok) cache[ik(cc, name)] = await r.json();
    } catch(e) {}
  }));

  // Re-render with fresh data
  main.innerHTML = active.map(({cc,name}) => buildCard(cc, name, cache[ik(cc,name)] || null)).join('');
  drawAllCharts();

  // Update refresh label
  const n = new Date();
  const p = v => String(v).padStart(2,'0');
  document.getElementById('refreshLbl').textContent = `REFRESHED ${p(n.getUTCHours())}:${p(n.getUTCMinutes())} UTC`;
}

// ── Sidebar toggle ────────────────────────────────────────────────────────────
(function() {
  const sb  = document.getElementById('sidebar');
  const btn = document.getElementById('sbToggle');
  // Load saved state
  const open = localStorage.getItem('sb_open') === '1';
  if (open) { sb.classList.remove('collapsed'); btn.textContent = '◀'; btn.style.left = '240px'; }
  else       { sb.classList.add('collapsed');    btn.textContent = '▶'; btn.style.left = '0'; }
  btn.onclick = () => {
    const isOpen = !sb.classList.contains('collapsed');
    if (isOpen) {
      sb.classList.add('collapsed');
      btn.textContent = '▶';
      btn.style.left = '0';
      localStorage.setItem('sb_open', '0');
    } else {
      sb.classList.remove('collapsed');
      btn.textContent = '◀';
      btn.style.left = '240px';
      localStorage.setItem('sb_open', '0'); // still default closed next time
    }
    setTimeout(drawAllCharts, 220); // redraw after transition
  };
})();
function tick() {
  const n = new Date(), p = v => String(v).padStart(2,'0');
  document.getElementById('clock').textContent =
    p(n.getUTCHours()) + ':' + p(n.getUTCMinutes()) + ':' + p(n.getUTCSeconds()) + ' UTC';
}
setInterval(tick, 1000); tick();

// ── Countdown ─────────────────────────────────────────────────────────────────
let cd = REFRESH_S;
setInterval(() => {
  cd--;
  document.getElementById('progressFill').style.width = ((REFRESH_S - cd) / REFRESH_S * 100).toFixed(1) + '%';
  if (cd > 0) document.getElementById('refreshLbl').textContent = `REFRESH IN ${cd}s`;
  if (cd <= 0) { cd = REFRESH_S; renderCharts(); }
}, 1000);

// ── Category ──────────────────────────────────────────────────────────────────
document.getElementById('cats').addEventListener('click', e => {
  const b = e.target.closest('.cat'); if (!b) return;
  cat = b.dataset.cat;
  document.querySelectorAll('.cat').forEach(x => x.classList.toggle('on', x === b));
  renderSidebar();
});

window.addEventListener('resize', drawAllCharts);

// ── Init ──────────────────────────────────────────────────────────────────────
load();
document.getElementById('tzToggle').textContent = tzMode === 'utc' ? 'TCT' : 'LOCAL';
renderSidebar();
renderCharts();
</script>
</body>
</html>
