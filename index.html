<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORN · Stock Command</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #07090f;
  --surface:  #0d1117;
  --surface2: #111827;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.12);
  --text:     #e2e8f0;
  --muted:    #4b5563;
  --green:    #00e676;
  --green-dim:#003d1e;
  --red:      #ff1744;
  --red-dim:  #3d0008;
  --amber:    #ffab00;
  --amber-dim:#3d2900;
  --blue:     #2979ff;
  --blue-dim: #001040;
  --cyan:     #00e5ff;
  --white:    #ffffff;
  --chart-h:  220px;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  display: flex;
  flex-direction: column;
}

/* ── TOP BAR ──────────────────────────────── */
.topbar {
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border2);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 20px;
  flex-shrink: 0;
  z-index: 10;
}
.brand {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 2px;
  white-space: nowrap;
}
.brand span { color: var(--green); }
.topbar-clock {
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  color: var(--amber);
  letter-spacing: 1px;
  margin-left: auto;
  white-space: nowrap;
}
.topbar-refresh {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.refresh-dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  margin-right: 5px;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }

/* ── LAYOUT ───────────────────────────────── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ──────────────────────────────── */
.sidebar {
  width: 240px;
  min-width: 240px;
  background: var(--surface);
  border-right: 1px solid var(--border2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sb-head {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.cats {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.cat {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  padding: 3px 9px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  color: var(--muted);
  background: transparent;
  cursor: pointer;
  transition: all .15s;
}
.cat:hover { color: var(--text); border-color: rgba(255,255,255,.25); }
.cat.on { color: var(--bg); background: var(--white); border-color: var(--white); }

.sb-scroll { flex:1; overflow-y:auto; padding: 8px 0; }
.sb-scroll::-webkit-scrollbar { width: 3px; }
.sb-scroll::-webkit-scrollbar-thumb { background: var(--border2); }

.cc-group { margin-bottom: 2px; }
.cc-hdr {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .5px;
  color: var(--muted);
  text-transform: uppercase;
  transition: color .1s;
  user-select: none;
}
.cc-hdr:hover { color: var(--text); }
.cc-flag { font-size: 16px; }
.cc-ft { font-size: 11px; font-weight: 400; margin-left: auto; color: var(--muted); font-family: 'Space Mono', monospace; }
.cc-arrow { font-size: 9px; transition: transform .15s; color: var(--muted); }
.cc-arrow.open { transform: rotate(90deg); }

.item-list { padding: 2px 8px 4px 20px; }
.item-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 5px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  color: rgba(226,232,240,.6);
  transition: all .1s;
}
.item-row:hover { background: var(--surface2); color: var(--text); }
.item-row.active { color: var(--text); }
.chk {
  width: 16px; height: 16px;
  border-radius: 4px;
  border: 1.5px solid var(--border2);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  transition: all .1s;
}
.chk.on { background: var(--green); border-color: var(--green); color: var(--bg); }

/* ── CHARTS AREA ──────────────────────────── */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  background: var(--bg);
}
.main::-webkit-scrollbar { width: 5px; }
.main::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 12px;
  color: var(--muted);
  text-align: center;
}
.empty-state .empty-icon { font-size: 48px; opacity: .3; margin-bottom: 8px; }
.empty-state h2 { font-size: 22px; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,.15); }
.empty-state p { font-size: 14px; color: var(--muted); line-height: 1.6; }

/* ── CARD ─────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 16px;
  overflow: hidden;
  transition: border-color .2s;
}
.card.fly  { border-color: rgba(0,230,118,.3); }
.card.skip { border-color: rgba(255,23,68,.2); }
.card.wait { border-color: rgba(255,171,0,.25); }

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 16px 20px 12px;
  gap: 12px;
}
.card-meta {}
.card-name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .5px;
  color: var(--white);
  line-height: 1.2;
}
.card-sub {
  font-size: 13px;
  color: var(--muted);
  margin-top: 3px;
  font-family: 'Space Mono', monospace;
  letter-spacing: .5px;
}

.decision {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  padding: 6px 14px;
  border-radius: 4px;
  border: 1.5px solid;
  white-space: nowrap;
  flex-shrink: 0;
}
.decision.fly  { color: var(--green); border-color: var(--green); background: var(--green-dim); }
.decision.skip { color: var(--red);   border-color: var(--red);   background: var(--red-dim); }
.decision.wait { color: var(--amber); border-color: var(--amber); background: var(--amber-dim); }
.decision.none { color: var(--muted); border-color: var(--muted); background: transparent; }

/* Stats row */
.stats {
  display: flex;
  gap: 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.stat {
  flex: 1;
  padding: 10px 16px;
  border-right: 1px solid var(--border);
}
.stat:last-child { border-right: none; }
.stat-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 3px;
}
.stat-value {
  font-family: 'Space Mono', monospace;
  font-size: 16px;
  font-weight: 700;
  color: var(--white);
}
.stat-value.green { color: var(--green); }
.stat-value.red   { color: var(--red); }
.stat-value.amber { color: var(--amber); }
.stat-value.blue  { color: var(--cyan); }

/* Reason */
.reason {
  padding: 9px 20px;
  font-size: 13px;
  color: rgba(226,232,240,.55);
  border-bottom: 1px solid var(--border);
  letter-spacing: .3px;
  font-family: 'Space Mono', monospace;
  line-height: 1.5;
}

/* Chart */
.chart-section { padding: 16px 20px 20px; }
.chart-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.chart-wrap { position: relative; }
canvas {
  display: block;
  width: 100%;
  height: var(--chart-h);
  border-radius: 6px;
  background: var(--bg);
}

/* Legend */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 10px;
}
.leg {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .5px;
}
.leg-line {
  width: 20px; height: 2px;
  border-radius: 1px;
  flex-shrink: 0;
}
.leg-dash {
  width: 20px; height: 2px;
  flex-shrink: 0;
  border-top: 2px dashed;
}

/* Confidence bar */
.conf {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px 14px;
  border-top: 1px solid var(--border);
}
.conf-label { font-size: 11px; font-weight:700; letter-spacing:1.5px; color: var(--muted); white-space:nowrap; }
.conf-track { flex:1; height:4px; background: rgba(255,255,255,.07); border-radius:2px; overflow:hidden; }
.conf-fill { height:100%; border-radius:2px; transition: width .5s ease; }
.conf-pct { font-family:'Space Mono',monospace; font-size:12px; color:var(--white); white-space:nowrap; }

/* Progress bar at bottom */
.progress-bar {
  height: 3px;
  background: var(--surface);
  flex-shrink: 0;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--cyan));
  transition: width 1s linear;
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">TORN<span>·</span>STOCK COMMAND</div>
  <div class="topbar-refresh">
    <span class="refresh-dot"></span>
    <span id="refreshLbl">REFRESH IN 60s</span>
  </div>
  <div class="topbar-clock" id="clock">--:--:-- UTC</div>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sb-head">
      <div class="sb-label">Category</div>
      <div class="cats" id="cats">
        <button class="cat on"  data-cat="all">All</button>
        <button class="cat"     data-cat="drug">Drugs</button>
        <button class="cat"     data-cat="plushie">Plushies</button>
        <button class="cat"     data-cat="flower">Flowers</button>
        <button class="cat"     data-cat="weapon">Weapons</button>
        <button class="cat"     data-cat="other">Other</button>
      </div>
    </div>
    <div class="sb-scroll" id="sbScroll"></div>
  </div>

  <!-- MAIN -->
  <div class="main" id="main">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📈</div>
      <h2>NO ITEMS SELECTED</h2>
      <p>Tick any item on the left<br>to start tracking</p>
    </div>
  </div>

</div>

<!-- PROGRESS BAR -->
<div class="progress-bar">
  <div class="progress-fill" id="progressFill" style="width:0%"></div>
</div>

<script>
'use strict';
const TOKEN = 'v3CWFEDg24av';
const PRED  = '/api/predict';
const REFRESH_S = 60;
const TL_PAST = 30; // mins of simulated history shown left of NOW
const TL_FUTURE = 270; // mins shown right of NOW
const TL_TOTAL = TL_PAST + TL_FUTURE;

const CC = {
  mex:{n:'Mexico',      flag:'🇲🇽', ft:18},
  cay:{n:'Cayman',      flag:'🇰🇾', ft:25},
  can:{n:'Canada',      flag:'🇨🇦', ft:29},
  haw:{n:'Hawaii',      flag:'🌺',  ft:94},
  uni:{n:'UK',          flag:'🇬🇧', ft:111},
  arg:{n:'Argentina',   flag:'🇦🇷', ft:117},
  swi:{n:'Switzerland', flag:'🇨🇭', ft:123},
  jap:{n:'Japan',       flag:'🇯🇵', ft:158},
  chi:{n:'China',       flag:'🇨🇳', ft:169},
  uae:{n:'UAE',         flag:'🇦🇪', ft:190},
  sou:{n:'S. Africa',   flag:'🇿🇦', ft:208},
};

const ITEMS = {
  mex:[{n:'Jaguar Plushie',c:'plushie'},{n:'Mayan Statue',c:'other'},{n:'Dahlia',c:'flower'},
       {n:'AK-47',c:'weapon'},{n:'Minigun',c:'weapon'},{n:'9mm Uzi',c:'weapon'},
       {n:'M249 SAW',c:'weapon'},{n:'Bottle of Tequila',c:'other'},{n:'Obsidian Point',c:'other'}],
  cay:[{n:'Stingray Plushie',c:'plushie'},{n:'Banana Orchid',c:'flower'},{n:'Nodding Turtle',c:'other'},
       {n:'Snorkel',c:'other'},{n:'Naval Cutlass',c:'weapon'},{n:'Diamond Bladed Knife',c:'weapon'},{n:'Bearer Bond',c:'other'}],
  can:[{n:'Wolverine Plushie',c:'plushie'},{n:'Crocus',c:'flower'},{n:'Xanax',c:'drug'},
       {n:'Cannabis',c:'drug'},{n:'Vicodin',c:'drug'},{n:'PCP',c:'drug'},{n:'Hockey Stick',c:'weapon'}],
  haw:[{n:'Orchid',c:'flower'},{n:'Pele Charm',c:'other'},{n:'Small Suitcase',c:'other'},
       {n:'Medium Suitcase',c:'other'},{n:'Large Suitcase',c:'other'},{n:'Shark Fin',c:'other'}],
  uni:[{n:'Heather',c:'flower'},{n:'Red Fox Plushie',c:'plushie'},{n:'Nessie Plushie',c:'plushie'},
       {n:'Xanax',c:'drug'},{n:'Cannabis',c:'drug'},{n:'Vicodin',c:'drug'},
       {n:'Ecstasy',c:'drug'},{n:'PCP',c:'drug'},{n:'Shrooms',c:'drug'}],
  arg:[{n:'Ceibo Flower',c:'flower'},{n:'Monkey Plushie',c:'plushie'},{n:'Cannabis',c:'drug'},
       {n:'LSD',c:'drug'},{n:'Ketamine',c:'drug'},{n:'Speed',c:'drug'},{n:'Flamethrower',c:'weapon'}],
  swi:[{n:'Edelweiss',c:'flower'},{n:'Chamois Plushie',c:'plushie'},{n:'Cannabis',c:'drug'},
       {n:'LSD',c:'drug'},{n:'Ketamine',c:'drug'},{n:'Speed',c:'drug'},{n:'PCP',c:'drug'},
       {n:'Neumune Tablet',c:'drug'},{n:'Ephedrine Powder',c:'drug'},{n:'SIG 552',c:'weapon'}],
  jap:[{n:'Cherry Blossom',c:'flower'},{n:'Xanax',c:'drug'},{n:'Ketamine',c:'drug'},
       {n:'Vicodin',c:'drug'},{n:'Ecstasy',c:'drug'},{n:'Speed',c:'drug'},{n:'Opium',c:'drug'},
       {n:'Kabuki Mask',c:'other'},{n:'Sumo Doll',c:'plushie'},{n:'BT MP9',c:'weapon'}],
  chi:[{n:'Peony',c:'flower'},{n:'Panda Plushie',c:'plushie'},{n:'Ecstasy',c:'drug'},
       {n:'LSD',c:'drug'},{n:'Speed',c:'drug'},{n:'PCP',c:'drug'},{n:'Katana',c:'weapon'}],
  uae:[{n:'Tribulus Omanense',c:'flower'},{n:'Camel Plushie',c:'plushie'},
       {n:'Gold Laptop',c:'other'},{n:'Natural Pearls',c:'other'},{n:'Ambergris Lump',c:'other'}],
  sou:[{n:'African Violet',c:'flower'},{n:'Lion Plushie',c:'plushie'},{n:'Xanax',c:'drug'},
       {n:'PCP',c:'drug'},{n:'LSD',c:'drug'},{n:'Opium',c:'drug'},{n:'Spear',c:'weapon'}],
};

let enabled = {}, collapsed = {}, cat = 'all', cache = {};

function save() { localStorage.setItem('tsc_v1', JSON.stringify({enabled, collapsed})); }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem('tsc_v1') || '{}');
    enabled   = s.enabled   || {};
    collapsed = s.collapsed || {};
  } catch(e) { enabled = {}; collapsed = {}; }
}
function ik(cc, n) { return cc + '|' + n; }

// ── Sidebar ──────────────────────────────────────────────────────────────────
function renderSidebar() {
  const sb = document.getElementById('sbScroll');
  sb.innerHTML = '';
  for (const [cc, items] of Object.entries(ITEMS)) {
    const vis = items.filter(i => cat === 'all' || i.c === cat);
    if (!vis.length) continue;
    const m = CC[cc], open = !collapsed[cc];
    const g = document.createElement('div'); g.className = 'cc-group';
    const h = document.createElement('div'); h.className = 'cc-hdr';
    h.innerHTML = `<span class="cc-arrow ${open ? 'open' : ''}">▶</span><span class="cc-flag">${m.flag}</span>${m.n}<span class="cc-ft">${m.ft}m</span>`;
    h.onclick = () => { collapsed[cc] = !collapsed[cc]; save(); renderSidebar(); };
    const rows = document.createElement('div'); rows.className = 'item-list';
    rows.style.display = open ? 'block' : 'none';
    vis.forEach(item => {
      const k = ik(cc, item.n), on = !!enabled[k];
      const r = document.createElement('div');
      r.className = 'item-row' + (on ? ' active' : '');
      r.innerHTML = `<div class="chk ${on ? 'on' : ''}">${on ? '✓' : ''}</div>${item.n}`;
      r.onclick = () => { enabled[k] = !enabled[k]; save(); renderSidebar(); renderCharts(); };
      rows.appendChild(r);
    });
    g.appendChild(h); g.appendChild(rows); sb.appendChild(g);
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fm(m) {
  if (m === null || m === undefined) return '—';
  m = Math.round(m);
  return m < 60 ? m + 'm' : Math.floor(m/60) + 'h' + (m%60 ? m%60+'m' : '');
}
function fmNum(n) {
  if (n === null || n === undefined) return '—';
  if (n >= 1000) return Math.round(n/100)/10 + 'k';
  return String(Math.round(n));
}

// ── Chart drawing ─────────────────────────────────────────────────────────────
function drawChart(canvas, pred, ft) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth;
  const H = 220;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const PAD = { top: 24, right: 24, bottom: 40, left: 58 };
  const CW = W - PAD.left - PAD.right;
  const CH = H - PAD.top  - PAD.bottom;

  const a         = (pred && pred.analysis) || {};
  const cur       = a.currentStock   || 0;
  const rate      = a.depletionRate  || 0;
  const rst       = pred ? pred.restockEta : null;         // minutes from now
  const dur       = a.avgStockDuration   || null;
  const afterRst  = a.avgStockAfterRestock || cur;
  const nw        = pred ? (pred.nextWindowMins || 0) : 0; // depart in Xm
  const lnd       = nw + ft;

  // ── Build timeline points [{t, q}] where t = mins relative to NOW (0)
  // t < 0 = past, t >= 0 = future
  const pts = [];

  // Simulated past — flat slightly higher (as if stock was more)
  // Just show a gentle slope downward into NOW if depleting
  const pastStock = rate > 0 ? Math.min(cur + rate * TL_PAST * 0.3, cur * 1.4 + 50) : cur;
  pts.push({ t: -TL_PAST, q: pastStock, past: true });
  pts.push({ t: 0, q: cur, past: true });

  // Current depletion — solid line going forward
  if (cur > 0 && rate > 0) {
    const depletesAt = cur / rate;
    let t = 2;
    while (t < Math.min(depletesAt, TL_FUTURE) + 2) {
      pts.push({ t, q: Math.max(0, cur - rate * t), past: false });
      t += 2;
    }
    if (depletesAt < TL_FUTURE) pts.push({ t: depletesAt, q: 0, past: false });
  } else if (cur > 0) {
    pts.push({ t: TL_FUTURE, q: cur, past: false });
  } else {
    pts.push({ t: 0.01, q: 0, past: false });
  }

  // Post-restock prediction — dashed gray
  const rstPts = [];
  if (rst !== null && rst > 0 && rst < TL_FUTURE) {
    const stockAtRst = afterRst || 800;
    rstPts.push({ t: rst, q: 0 });
    rstPts.push({ t: rst, q: stockAtRst });
    if (rate > 0 && dur) {
      let t = rst;
      while (t <= Math.min(rst + dur + 4, TL_FUTURE)) {
        rstPts.push({ t, q: Math.max(0, stockAtRst - rate * (t - rst)) });
        t += 2;
      }
    } else {
      rstPts.push({ t: Math.min(rst + (dur || 60), TL_FUTURE), q: 0 });
    }
  }

  // Max Y
  let maxY = Math.max(cur, pastStock, afterRst || 0);
  if (maxY < 10) maxY = 100;
  maxY = maxY * 1.2;

  // Coordinate transforms
  // t ranges from -TL_PAST to TL_FUTURE, mapped to [PAD.left, PAD.left+CW]
  const tx = t => PAD.left + ((t + TL_PAST) / TL_TOTAL) * CW;
  const ty = q => PAD.top  + CH - (Math.min(q, maxY) / maxY) * CH;
  const nowX = tx(0);

  // ── Background ─────────────────────────────────────────────────────────────
  ctx.fillStyle = '#07090f';
  ctx.fillRect(0, 0, W, H);

  // ── Past zone (slight tint) ─────────────────────────────────────────────────
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  ctx.fillRect(PAD.left, PAD.top, nowX - PAD.left, CH);

  // ── Grid lines ──────────────────────────────────────────────────────────────
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  // Horizontal
  for (let i = 0; i <= 4; i++) {
    const y = PAD.top + (i / 4) * CH;
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + CW, y); ctx.stroke();
  }
  // Vertical (every 30m)
  for (let t = -TL_PAST; t <= TL_FUTURE; t += 30) {
    if (t === 0) continue;
    const x = tx(t);
    ctx.beginPath(); ctx.moveTo(x, PAD.top); ctx.lineTo(x, PAD.top + CH); ctx.stroke();
  }

  // ── Flight zone shading ─────────────────────────────────────────────────────
  if (nw < TL_FUTURE && lnd < TL_FUTURE) {
    ctx.fillStyle = 'rgba(41,121,255,0.08)';
    const x1 = tx(nw), x2 = tx(Math.min(lnd, TL_FUTURE));
    ctx.fillRect(x1, PAD.top, x2 - x1, CH);
  }

  // ── Restock window shading ──────────────────────────────────────────────────
  if (rst !== null && rst < TL_FUTURE && dur) {
    ctx.fillStyle = 'rgba(0,230,118,0.06)';
    const x1 = tx(rst), x2 = tx(Math.min(rst + dur, TL_FUTURE));
    ctx.fillRect(x1, PAD.top, x2 - x1, CH);
  }

  // ── Post-restock dashed gray line ───────────────────────────────────────────
  if (rstPts.length > 1) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    rstPts.forEach((p, i) => {
      if (i === 0 || (rstPts[i-1].q === 0 && p.q > 0)) ctx.moveTo(tx(p.t), ty(p.q));
      else ctx.lineTo(tx(p.t), ty(p.q));
    });
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // ── Past line (dimmer, same color) ──────────────────────────────────────────
  const pastOnly = pts.filter(p => p.t <= 0);
  if (pastOnly.length > 1) {
    // Gradient: dim on left, brighter at NOW
    const grad = ctx.createLinearGradient(tx(-TL_PAST), 0, nowX, 0);
    grad.addColorStop(0, 'rgba(226,232,240,0.1)');
    grad.addColorStop(1, 'rgba(226,232,240,0.5)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.beginPath();
    pastOnly.forEach((p, i) => i === 0 ? ctx.moveTo(tx(p.t), ty(p.q)) : ctx.lineTo(tx(p.t), ty(p.q)));
    ctx.stroke();
  }

  // ── Current + future stock line ─────────────────────────────────────────────
  const futPts = pts.filter(p => p.t >= 0);
  if (futPts.length > 1) {
    // Fill under line
    const grad = ctx.createLinearGradient(0, PAD.top, 0, PAD.top + CH);
    grad.addColorStop(0, 'rgba(0,230,118,0.15)');
    grad.addColorStop(1, 'rgba(0,230,118,0.01)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(tx(futPts[0].t), PAD.top + CH);
    futPts.forEach(p => ctx.lineTo(tx(p.t), ty(p.q)));
    ctx.lineTo(tx(futPts[futPts.length-1].t), PAD.top + CH);
    ctx.closePath(); ctx.fill();
    // Line
    ctx.strokeStyle = '#00e676';
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    futPts.forEach((p, i) => i === 0 ? ctx.moveTo(tx(p.t), ty(p.q)) : ctx.lineTo(tx(p.t), ty(p.q)));
    ctx.stroke();
  }

  // ── Dot at NOW ─────────────────────────────────────────────────────────────
  ctx.fillStyle = '#00e676';
  ctx.beginPath();
  ctx.arc(tx(0), ty(cur), 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#07090f';
  ctx.beginPath();
  ctx.arc(tx(0), ty(cur), 2.5, 0, Math.PI * 2);
  ctx.fill();

  // ── Vertical markers ────────────────────────────────────────────────────────
  function vline(t, color, label, labelY, dashed) {
    if (t < -TL_PAST || t > TL_FUTURE) return;
    const x = tx(t);
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    if (dashed) ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(x, PAD.top); ctx.lineTo(x, PAD.top + CH); ctx.stroke();
    ctx.setLineDash([]);

    // Label tag
    ctx.fillStyle = color;
    ctx.font = 'bold 9px "Space Mono", monospace';
    ctx.textAlign = 'center';
    const tw = ctx.measureText(label).width + 8;
    const tx2 = Math.max(PAD.left + tw/2, Math.min(PAD.left + CW - tw/2, x));
    ctx.fillRect(tx2 - tw/2, PAD.top + CH + (labelY === 2 ? 18 : 6), tw, 14);
    ctx.fillStyle = '#07090f';
    ctx.fillText(label, tx2, PAD.top + CH + (labelY === 2 ? 28 : 16));
    ctx.restore();
  }

  // NOW line (white dashed)
  vline(0, 'rgba(255,255,255,0.7)', 'NOW', 1, true);
  // Depart
  if (nw >= 0 && nw < TL_FUTURE) vline(nw, '#2979ff', 'DEP ' + fm(nw), 2, false);
  // Land
  if (lnd < TL_FUTURE) vline(lnd, '#00e5ff', 'LND ' + fm(lnd), lnd - nw > 20 ? 2 : 1, false);
  // Restock
  if (rst !== null && rst > 0 && rst < TL_FUTURE) vline(rst, '#00e676', 'RST ' + fm(rst), rst > 20 ? 1 : 2, true);

  // ── Axes ────────────────────────────────────────────────────────────────────
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.setLineDash([]);
  // Y axis
  ctx.beginPath(); ctx.moveTo(PAD.left, PAD.top); ctx.lineTo(PAD.left, PAD.top + CH); ctx.stroke();
  // X axis
  ctx.beginPath(); ctx.moveTo(PAD.left, PAD.top + CH); ctx.lineTo(PAD.left + CW, PAD.top + CH); ctx.stroke();

  // ── Y labels ────────────────────────────────────────────────────────────────
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '9px "Space Mono", monospace';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const q = Math.round(maxY * (1 - i/4));
    ctx.fillText(fmNum(q), PAD.left - 8, PAD.top + (i/4) * CH + 4);
  }

  // ── X labels ────────────────────────────────────────────────────────────────
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.font = '9px "Space Mono", monospace';
  for (let t = -TL_PAST; t <= TL_FUTURE; t += 60) {
    const label = t < 0 ? '-' + fm(-t) : (t === 0 ? '' : '+' + fm(t));
    if (label) ctx.fillText(label, tx(t), PAD.top + CH + 12);
  }

  // ── Stock qty label near NOW dot ─────────────────────────────────────────────
  if (cur > 0) {
    ctx.font = 'bold 10px "Space Mono", monospace';
    ctx.fillStyle = '#00e676';
    ctx.textAlign = 'left';
    ctx.fillText(fmNum(cur), nowX + 8, ty(cur) - 2);
  }
}

// ── Card builder ──────────────────────────────────────────────────────────────
let cardIdx = 0;
function buildCard(cc, name, pred) {
  const m   = CC[cc];
  const a   = (pred && pred.analysis) || {};
  const fly = pred && pred.fly;
  const nw  = pred ? pred.nextWindowMins : null;
  const rst = pred ? pred.restockEta : null;
  const conf = (pred && pred.confidence) || 0;
  const cp = Math.round(conf * 100);

  let decCls, decTxt;
  if (!pred)          { decCls = 'none'; decTxt = 'LOADING'; }
  else if (fly===true){ decCls = 'fly';  decTxt = '▶  FLY'; }
  else if (nw > 0)    { decCls = 'wait'; decTxt = `DEPART IN ${fm(nw)}`; }
  else if (fly===false){ decCls = 'skip'; decTxt = '■  SKIP'; }
  else                { decCls = 'none'; decTxt = 'NO DATA'; }

  const cfColor = cp > 70 ? '#00e676' : cp > 40 ? '#ffab00' : '#ff1744';
  const cid = 'c' + (++cardIdx);

  // Stat colors
  const stockColor = a.currentStock > 0 ? 'green' : 'red';
  const nwColor    = fly === true ? 'green' : (nw > 0 ? 'amber' : '');
  const rstColor   = rst !== null && rst < (m.ft + 30) ? 'amber' : '';

  return `<div class="card ${decCls}" data-cid="${cid}">
  <div class="card-top">
    <div class="card-meta">
      <div class="card-name">${name}</div>
      <div class="card-sub">${m.flag} ${m.n} &nbsp;·&nbsp; ${m.ft}m flight</div>
    </div>
    <div class="decision ${decCls}">${decTxt}</div>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-label">Stock Now</div>
      <div class="stat-value ${stockColor}">${fmNum(a.currentStock)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Restock In</div>
      <div class="stat-value ${rstColor}">${fm(rst)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Next Depart</div>
      <div class="stat-value ${nwColor}">${fm(nw)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Depletion/m</div>
      <div class="stat-value">${a.depletionRate || '—'}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Stock Lasts</div>
      <div class="stat-value">${fm(a.avgStockDuration)}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Interval</div>
      <div class="stat-value">${fm(a.avgRestockInterval)}</div>
    </div>
  </div>
  <div class="reason">${pred ? (pred.reason || '—') : 'Fetching data...'}</div>
  <div class="chart-section">
    <div class="chart-label">Stock Timeline &nbsp;·&nbsp; −30m to +${fm(TL_FUTURE)} window</div>
    <div class="chart-wrap">
      <canvas id="${cid}" style="height:220px"></canvas>
    </div>
    <div class="legend">
      <div class="leg"><div class="leg-line" style="background:#e2e8f0;opacity:.3"></div>Historical</div>
      <div class="leg"><div class="leg-line" style="background:#00e676"></div>Current stock</div>
      <div class="leg"><div class="leg-dash" style="border-color:rgba(255,255,255,.25)"></div>Projected (post-restock)</div>
      <div class="leg"><div class="leg-line" style="background:rgba(255,255,255,.5)"></div>NOW</div>
      <div class="leg"><div class="leg-line" style="background:#2979ff"></div>Depart</div>
      <div class="leg"><div class="leg-line" style="background:#00e5ff"></div>Land</div>
      <div class="leg"><div class="leg-line" style="background:#00e676;opacity:.5"></div>Restock</div>
    </div>
  </div>
  <div class="conf">
    <div class="conf-label">CONFIDENCE</div>
    <div class="conf-track"><div class="conf-fill" style="width:${cp}%;background:${cfColor}"></div></div>
    <div class="conf-pct">${cp}%</div>
  </div>
</div>`;
}

// ── Render charts ─────────────────────────────────────────────────────────────
async function renderCharts() {
  const main  = document.getElementById('main');
  const empty = document.getElementById('emptyState');
  const active = Object.entries(enabled)
    .filter(([,v]) => v)
    .map(([k]) => { const i = k.indexOf('|'); return { cc: k.slice(0,i), name: k.slice(i+1) }; });

  if (!active.length) {
    main.innerHTML = '';
    main.appendChild(empty);
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  // Render with cached / loading state
  main.innerHTML = active.map(({cc,name}) => buildCard(cc, name, cache[ik(cc,name)] || null)).join('');
  active.forEach(({cc,name}) => {
    const p = cache[ik(cc,name)] || null;
    const card = document.querySelector(`[data-cid]`);
    // Draw charts for cached items immediately
    const canvases = main.querySelectorAll('canvas');
    canvases.forEach(cv => {
      const cid = cv.id;
      const idx = active.findIndex(x => `c${active.indexOf(x)+1}` === cid || cv.closest('.card') === cv.parentElement.parentElement);
    });
  });
  // Draw all immediately
  const cards = main.querySelectorAll('.card');
  cards.forEach((card, i) => {
    const cv = card.querySelector('canvas');
    if (cv) drawChart(cv, cache[ik(active[i].cc, active[i].name)] || null, CC[active[i].cc].ft);
  });

  // Fetch fresh data
  await Promise.all(active.map(async ({cc, name}) => {
    try {
      const r = await fetch(`${PRED}?token=${TOKEN}&cc=${cc}&item=${encodeURIComponent(name)}`);
      if (r.ok) cache[ik(cc, name)] = await r.json();
    } catch(e) {}
  }));

  // Re-render with fresh data
  main.innerHTML = active.map(({cc,name}) => buildCard(cc, name, cache[ik(cc,name)] || null)).join('');
  const cards2 = main.querySelectorAll('.card');
  cards2.forEach((card, i) => {
    const cv = card.querySelector('canvas');
    if (cv) requestAnimationFrame(() => drawChart(cv, cache[ik(active[i].cc, active[i].name)] || null, CC[active[i].cc].ft));
  });

  // Update last refresh
  const n = new Date();
  const p = v => String(v).padStart(2,'0');
  document.getElementById('refreshLbl').textContent = `REFRESHED ${p(n.getUTCHours())}:${p(n.getUTCMinutes())} UTC`;
}

// ── Clock ─────────────────────────────────────────────────────────────────────
function tick() {
  const n = new Date(), p = v => String(v).padStart(2,'0');
  document.getElementById('clock').textContent =
    p(n.getUTCHours()) + ':' + p(n.getUTCMinutes()) + ':' + p(n.getUTCSeconds()) + ' UTC';
}
setInterval(tick, 1000); tick();

// ── Countdown ─────────────────────────────────────────────────────────────────
let cd = REFRESH_S;
setInterval(() => {
  cd--;
  document.getElementById('progressFill').style.width = ((REFRESH_S - cd) / REFRESH_S * 100).toFixed(1) + '%';
  if (cd > 0) document.getElementById('refreshLbl').textContent = `REFRESH IN ${cd}s`;
  if (cd <= 0) { cd = REFRESH_S; renderCharts(); }
}, 1000);

// ── Category ──────────────────────────────────────────────────────────────────
document.getElementById('cats').addEventListener('click', e => {
  const b = e.target.closest('.cat'); if (!b) return;
  cat = b.dataset.cat;
  document.querySelectorAll('.cat').forEach(x => x.classList.toggle('on', x === b));
  renderSidebar();
});

// ── Window resize — redraw charts ─────────────────────────────────────────────
window.addEventListener('resize', () => {
  const main = document.getElementById('main');
  const cards = main.querySelectorAll('.card');
  const active = Object.entries(enabled).filter(([,v])=>v).map(([k])=>{const i=k.indexOf('|');return{cc:k.slice(0,i),name:k.slice(i+1)}});
  cards.forEach((card, i) => {
    if (!active[i]) return;
    const cv = card.querySelector('canvas');
    if (cv) drawChart(cv, cache[ik(active[i].cc, active[i].name)] || null, CC[active[i].cc].ft);
  });
});

// ── Init ──────────────────────────────────────────────────────────────────────
load(); renderSidebar(); renderCharts();
</script>
</body>
