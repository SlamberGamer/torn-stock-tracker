<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORN STOCK TRACKER</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0e17;
  --panel:#1a1535;
  --panel2:#221d42;
  --red:#ff2d55;
  --green:#00ff88;
  --blue:#00b4ff;
  --yellow:#ffe000;
  --purple:#bf5fff;
  --orange:#ff8c00;
  --pink:#ff6eb4;
  --cyan:#00ffee;
  --white:#f0f0f0;
  --dim:#3a3560;
}
body{background:var(--bg);color:var(--white);font-family:'Press Start 2P',monospace;font-size:8px;min-height:100vh;overflow-x:hidden}

/* Pixel scanlines - subtle */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px)}

@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes scan{0%{left:-60%}100%{left:110%}}
@keyframes pixelpulse{0%,100%{box-shadow:0 0 0 2px var(--green)}50%{box-shadow:0 0 0 4px var(--green),0 0 16px var(--green)}}
.blink{animation:blink 1s step-end infinite}

/* ── HEADER ── */
.hdr{
  background:linear-gradient(135deg,#1a1535 0%,#2d1b5e 50%,#1a1535 100%);
  border-bottom:3px solid var(--yellow);
  padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  position:relative;overflow:hidden;
}
.hdr::before{
  content:'';position:absolute;top:0;left:-60%;height:100%;width:30%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.05),transparent);
  animation:scan 6s linear infinite;
}
.logo{
  font-size:13px;letter-spacing:2px;
  background:linear-gradient(90deg,var(--yellow),var(--orange),var(--red),var(--pink),var(--purple),var(--blue),var(--cyan),var(--green),var(--yellow));
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmer 4s linear infinite;
}
.sub{color:var(--dim);font-size:6px;letter-spacing:2px;margin-top:5px}
#clock{color:var(--yellow);font-size:9px;letter-spacing:2px}
#lastref{color:var(--dim);font-size:6px;margin-top:4px}

/* ── LAYOUT ── */
.layout{display:flex;height:calc(100vh - 62px)}

/* ── SIDEBAR ── */
.sb{
  width:200px;min-width:200px;
  background:var(--panel);
  border-right:3px solid var(--purple);
  overflow-y:auto;padding:10px;
}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--purple);border-radius:2px}

.sec-title{
  font-size:7px;letter-spacing:2px;margin-bottom:8px;
  padding:4px 0 6px;border-bottom:2px solid;
}
.sec-title.t-cat{color:var(--cyan);border-color:var(--cyan)}
.sec-title.t-items{color:var(--yellow);border-color:var(--yellow);margin-top:12px}

/* Category buttons */
.cats{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.cbtn{
  font-family:inherit;font-size:6px;padding:4px 6px;cursor:pointer;
  border:2px solid;background:transparent;letter-spacing:1px;
  transition:all .1s;
}
.cbtn[data-cat="all"]   {color:var(--white);border-color:var(--white)}
.cbtn[data-cat="drug"]  {color:var(--red);border-color:var(--red)}
.cbtn[data-cat="plushie"]{color:var(--pink);border-color:var(--pink)}
.cbtn[data-cat="flower"]{color:var(--green);border-color:var(--green)}
.cbtn[data-cat="weapon"]{color:var(--orange);border-color:var(--orange)}
.cbtn[data-cat="other"] {color:var(--blue);border-color:var(--blue)}
.cbtn.on,.cbtn:hover{filter:brightness(1.3)}
.cbtn[data-cat="all"].on   {background:var(--white);color:var(--bg)}
.cbtn[data-cat="drug"].on  {background:var(--red);color:var(--bg)}
.cbtn[data-cat="plushie"].on{background:var(--pink);color:var(--bg)}
.cbtn[data-cat="flower"].on{background:var(--green);color:var(--bg)}
.cbtn[data-cat="weapon"].on{background:var(--orange);color:var(--bg)}
.cbtn[data-cat="other"].on {background:var(--blue);color:var(--bg)}

/* Country groups */
.cgrp{margin-bottom:3px}
.chdr{
  display:flex;align-items:center;gap:5px;
  padding:5px 5px;cursor:pointer;
  font-size:6px;letter-spacing:1px;
  border-left:3px solid transparent;transition:all .1s;
}
.chdr:hover{border-left-color:currentColor;padding-left:8px}
.arr{font-size:5px;transition:transform .15s;display:inline-block}
.arr.open{transform:rotate(90deg)}
.flt{font-size:5px;margin-left:auto;opacity:.5}

/* Country colors */
.cc-mex{color:#ff6b35}.cc-cay{color:#00d4ff}.cc-can{color:#ff2d55}
.cc-haw{color:#ffaa00}.cc-uni{color:#4488ff}.cc-arg{color:#00e676}
.cc-swi{color:#ff4081}.cc-jap{color:#ff6680}.cc-chi{color:#ffdd00}
.cc-uae{color:#c8a000}.cc-sou{color:#b0ff4f}

.irows{padding:2px 4px 4px 14px}
.irow{
  display:flex;align-items:center;gap:6px;
  padding:3px 2px;cursor:pointer;font-size:6px;
  color:rgba(240,240,240,.7);letter-spacing:.5px;
  transition:color .1s;
}
.irow:hover{color:var(--white)}
.chk{
  width:10px;height:10px;flex-shrink:0;
  border:2px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;font-size:7px;
  transition:all .1s;
}
.chk.on{border-color:var(--green);background:var(--green);color:var(--bg)}

/* ── CHARTS AREA ── */
.charts{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:16px;text-align:center;
}
.empty-ico{font-size:40px;filter:grayscale(1);opacity:.3}
.empty p{font-size:7px;line-height:2.8;color:var(--dim)}
.empty strong{color:var(--yellow);font-style:normal}

/* ── CARD ── */
.card{
  border:3px solid;
  background:var(--panel);
  margin-bottom:16px;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:-60%;height:2px;width:40%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  animation:scan 5s linear infinite;
}

/* Card color themes */
.card.theme-fly {border-color:var(--green)}
.card.theme-skip{border-color:var(--red)}
.card.theme-wait{border-color:var(--yellow)}
.card.theme-none{border-color:var(--dim)}
.card.theme-load{border-color:var(--purple)}

.chead{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-bottom:2px solid rgba(255,255,255,.1);
  background:rgba(0,0,0,.3);
}
.cname{font-size:9px;letter-spacing:1px}
.ccountry{font-size:6px;margin-top:3px;opacity:.6}

.badge{font-size:8px;padding:4px 10px;border:2px solid;letter-spacing:1px;white-space:nowrap;font-family:inherit}
.b-fly {color:var(--green); border-color:var(--green); background:rgba(0,255,136,.1)}
.b-skip{color:var(--red);   border-color:var(--red);   background:rgba(255,45,85,.1)}
.b-wait{color:var(--yellow);border-color:var(--yellow);background:rgba(255,224,0,.1)}
.b-none{color:var(--dim);   border-color:var(--dim);   background:transparent}
.b-load{color:var(--purple);border-color:var(--purple);background:rgba(191,95,255,.1)}

.cbody{padding:12px}

/* Stats grid */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:8px;margin-bottom:12px;
}
.stat{
  background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.07);
  padding:6px 8px;border-radius:2px;
}
.slbl{font-size:5px;letter-spacing:1px;opacity:.5;margin-bottom:3px}
.sval{font-size:7px;color:var(--yellow)}
.sval.good{color:var(--green)}
.sval.bad {color:var(--red)}
.sval.warn{color:var(--orange)}

/* Reason */
.reason{
  font-size:6px;line-height:2.2;
  padding:7px 10px;margin-bottom:12px;
  background:rgba(0,0,0,.4);
  border-left:3px solid var(--cyan);
  color:rgba(240,240,240,.85);
  letter-spacing:.5px;word-break:break-word;
}

/* Chart */
.chart-wrap{position:relative;margin-bottom:4px}
canvas{display:block;width:100%;height:160px;image-rendering:pixelated}
.chart-title{font-size:6px;color:var(--cyan);letter-spacing:2px;margin-bottom:6px;opacity:.8}

/* Confidence */
.conf-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.conf-lbl{font-size:6px;color:rgba(255,255,255,.4);white-space:nowrap}
.conf-track{flex:1;height:8px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);overflow:hidden;border-radius:1px}
.conf-fill{height:100%;border-radius:1px;transition:width .6s ease}
.conf-pct{font-size:7px;color:var(--yellow);white-space:nowrap;min-width:28px}

/* Footer */
.fbar{position:fixed;bottom:0;left:0;right:0;height:4px;background:rgba(0,0,0,.5);z-index:100}
.fbar-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--blue),var(--cyan));transition:width 1s linear}
.fbar-lbl{position:fixed;bottom:7px;right:12px;font-size:6px;color:var(--dim);letter-spacing:1px;z-index:101}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="logo">TORN STOCK TRACKER</div>
    <div class="sub">FOREIGN STOCK INTELLIGENCE SYSTEM v2.1</div>
  </div>
  <div style="text-align:right">
    <div id="clock"><span class="blink">&#9608;</span> --:--:-- UTC</div>
    <div id="lastref">LAST REFRESH: --</div>
  </div>
</div>

<div class="layout">
  <div class="sb">
    <div class="sec-title t-cat">&#9654; CATEGORY</div>
    <div class="cats" id="cats">
      <button class="cbtn on" data-cat="all">ALL</button>

      <div class="empty-ico">&#128202;</div>

      <strong>SETTINGS AUTO-SAVED</strong></p>
    </div>
  </div>
</div>

<div class="fbar"><div class="fbar-fill" id="fbar" style="width:0%"></div></div>
<div class="fbar-lbl" id="flbl">REFRESH: 60s</div>

<script>
var TOKEN='v3CWFEDg24av', PRED='/api/predict', RS=60, TLW=300;

var CC={
  mex:{n:'Mexico',ft:18,cls:'cc-mex'},cay:{n:'Cayman',ft:25,cls:'cc-cay'},
  can:{n:'Canada',ft:29,cls:'cc-can'},haw:{n:'Hawaii',ft:94,cls:'cc-haw'},
  uni:{n:'UK',ft:111,cls:'cc-uni'},arg:{n:'Argentina',ft:117,cls:'cc-arg'},
  swi:{n:'Switzerland',ft:123,cls:'cc-swi'},jap:{n:'Japan',ft:158,cls:'cc-jap'},
  chi:{n:'China',ft:169,cls:'cc-chi'},uae:{n:'UAE',ft:190,cls:'cc-uae'},
  sou:{n:'S.Africa',ft:208,cls:'cc-sou'}
};

var IT={
  mex:[{n:'Jaguar Plushie',c:'plushie'},{n:'Mayan Statue',c:'other'},{n:'Dahlia',c:'flower'},
       {n:'AK-47',c:'weapon'},{n:'Minigun',c:'weapon'},{n:'9mm Uzi',c:'weapon'},
       {n:'M249 SAW',c:'weapon'},{n:'Bottle of Tequila',c:'other'},{n:'Obsidian Point',c:'other'}],
  cay:[{n:'Stingray Plushie',c:'plushie'},{n:'Banana Orchid',c:'flower'},{n:'Nodding Turtle',c:'other'},
       {n:'Snorkel',c:'other'},{n:'Flippers',c:'other'},{n:'Naval Cutlass',c:'weapon'},
       {n:'Diamond Bladed Knife',c:'weapon'},{n:'Bearer Bond',c:'other'}],
  can:[{n:'Wolverine Plushie',c:'plushie'},{n:'Crocus',c:'flower'},{n:'Xanax',c:'drug'},
       {n:'Cannabis',c:'drug'},{n:'Vicodin',c:'drug'},{n:'PCP',c:'drug'},
       {n:'Hockey Stick',c:'weapon'},{n:'Bear Gall',c:'other'}],
  haw:[{n:'Orchid',c:'flower'},{n:'Pele Charm',c:'other'},{n:'Small Suitcase',c:'other'},
       {n:'Medium Suitcase',c:'other'},{n:'Large Suitcase',c:'other'},{n:'Shark Fin',c:'other'}],
  uni:[{n:'Heather',c:'flower'},{n:'Red Fox Plushie',c:'plushie'},{n:'Nessie Plushie',c:'plushie'},
       {n:'Xanax',c:'drug'},{n:'Cannabis',c:'drug'},{n:'Vicodin',c:'drug'},
       {n:'Ecstasy',c:'drug'},{n:'PCP',c:'drug'},{n:'Shrooms',c:'drug'}],
  arg:[{n:'Ceibo Flower',c:'flower'},{n:'Monkey Plushie',c:'plushie'},{n:'Cannabis',c:'drug'},
       {n:'LSD',c:'drug'},{n:'Ketamine',c:'drug'},{n:'Speed',c:'drug'},
       {n:'Flamethrower',c:'weapon'},{n:'Meteorite Fragment',c:'other'}],
  swi:[{n:'Edelweiss',c:'flower'},{n:'Chamois Plushie',c:'plushie'},{n:'Cannabis',c:'drug'},
       {n:'LSD',c:'drug'},{n:'Ketamine',c:'drug'},{n:'Speed',c:'drug'},{n:'PCP',c:'drug'},
       {n:'Neumune Tablet',c:'drug'},{n:'Ephedrine Powder',c:'drug'},
       {n:'SIG 552',c:'weapon'},{n:'Swiss Army Knife',c:'weapon'}],
  jap:[{n:'Cherry Blossom',c:'flower'},{n:'Xanax',c:'drug'},{n:'Ketamine',c:'drug'},
       {n:'Vicodin',c:'drug'},{n:'Ecstasy',c:'drug'},{n:'Speed',c:'drug'},{n:'Opium',c:'drug'},
       {n:'Kabuki Mask',c:'other'},{n:'Sumo Doll',c:'plushie'},{n:'BT MP9',c:'weapon'},
       {n:'Counterfeit Manga',c:'other'}],
  chi:[{n:'Peony',c:'flower'},{n:'Panda Plushie',c:'plushie'},{n:'Ecstasy',c:'drug'},
       {n:'LSD',c:'drug'},{n:'Speed',c:'drug'},{n:'PCP',c:'drug'},
       {n:'Katana',c:'weapon'},{n:'Pangolin Scales',c:'other'}],
  uae:[{n:'Tribulus Omanense',c:'flower'},{n:'Camel Plushie',c:'plushie'},
       {n:'Gold Laptop',c:'other'},{n:'Natural Pearls',c:'other'},
       {n:'Sports Shades',c:'other'},{n:'Ambergris Lump',c:'other'}],
  sou:[{n:'African Violet',c:'flower'},{n:'Lion Plushie',c:'plushie'},{n:'Xanax',c:'drug'},
       {n:'PCP',c:'drug'},{n:'LSD',c:'drug'},{n:'Opium',c:'drug'},
       {n:'Spear',c:'weapon'},{n:'Uncut Diamonds',c:'other'}]
};

var en={},col={},cat='all',cache={};
function save(){localStorage.setItem('tst_v5',JSON.stringify({en:en,col:col}))}
function load(){try{var s=JSON.parse(localStorage.getItem('tst_v5')||'{}');en=s.en||{};col=s.col||{}}catch(e){en={};col={}}}
function ik(cc,n){return cc+'|'+n}

function renderSidebar(){
  var list=document.getElementById('clist');list.innerHTML='';
  Object.keys(IT).forEach(function(cc){
    var items=IT[cc];
    var vis=items.filter(function(i){return cat==='all'||i.c===cat});
    if(!vis.length) return;
    var m=CC[cc],open=!col[cc];
    var g=document.createElement('div');g.className='cgrp';
    var h=document.createElement('div');h.className='chdr '+m.cls;
    h.innerHTML='<span class="arr '+(open?'open':'')+'">&#9658;</span>'+m.n.toUpperCase()+'<span class="flt">'+m.ft+'M</span>';
    (function(c){h.onclick=function(){col[c]=!col[c];save();renderSidebar()}})(cc);
    var rows=document.createElement('div');rows.className='irows';
    rows.style.display=open?'block':'none';
    vis.forEach(function(item){
      var k=ik(cc,item.n),on=!!en[k];
      var r=document.createElement('div');r.className='irow';
      r.innerHTML='<div class="chk '+(on?'on':'')+'>'+(on?'&#10003;':'')+'</div><span>'+item.n+'</span>';
      (function(c,n){r.onclick=function(){en[ik(c,n)]=!en[ik(c,n)];save();renderSidebar();renderCharts()}})(cc,item.n);
      rows.appendChild(r);
    });
    g.appendChild(h);g.appendChild(rows);list.appendChild(g);
  });
}

// ── CANVAS CHART ────────────────────────────────────────────────────────────
function drawChart(canvasId, pred, ft) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W = canvas.width = canvas.offsetWidth * window.devicePixelRatio || 600;
  var H = canvas.height = 160 * window.devicePixelRatio || 320;
  var dpr = window.devicePixelRatio || 1;
  ctx.scale(dpr, dpr);
  W = canvas.offsetWidth; H = 160;

  var PAD = {top:20, right:20, bottom:36, left:56};
  var CW = W - PAD.left - PAD.right;
  var CH = H - PAD.top  - PAD.bottom;

  // Background
  ctx.fillStyle = '#0a0916';
  ctx.fillRect(0, 0, W, H);

  var a   = (pred && pred.analysis) || {};
  var rst = pred ? pred.restockEta : null;
  var dur = a.avgStockDuration;
  var dep = pred ? (pred.nextWindowMins || 0) : 0;
  var lnd = dep + ft;
  var cur = a.currentStock || 0;
  var rate= a.depletionRate || 0;
  var afterRst = a.avgStockAfterRestock || 0;
  var conf= (pred && pred.confidence) || 0;

  // Build data points for line: [time_minutes, stock_qty]
  var pts = [];

  if (cur > 0 && rate > 0) {
    // Stock depleting now
    var t = 0;
    while (t <= Math.min(TLW, cur/rate + 5)) {
      pts.push([t, Math.max(0, cur - rate*t)]);
      t += 2;
    }
  } else if (cur > 0) {
    pts.push([0, cur]);
    pts.push([TLW, cur]);
  } else {
    pts.push([0, 0]);
  }

  // Add restock bump
  if (rst != null && rst < TLW && afterRst > 0) {
    // Gap to zero before restock
    if (pts[pts.length-1][1] > 0) pts.push([rst - 0.1, 0]);
    pts.push([rst, afterRst]);
    // Depletion after restock
    if (rate > 0 && dur) {
      var t2 = rst;
      while (t2 <= Math.min(TLW, rst + dur + 5)) {
        pts.push([t2, Math.max(0, afterRst - rate*(t2-rst))]);
        t2 += 2;
      }
    } else {
      pts.push([rst + (dur||30), 0]);
    }
  }

  // Make sure we end at TLW
  if (!pts.length || pts[pts.length-1][0] < TLW) pts.push([TLW, 0]);

  // Sort by time
  pts.sort(function(a,b){return a[0]-b[0]});

  // Max Y
  var maxY = 0;
  pts.forEach(function(p){if(p[1]>maxY)maxY=p[1]});
  if (afterRst > maxY) maxY = afterRst;
  if (maxY === 0) maxY = 100;
  maxY = maxY * 1.15;

  // Coordinate helpers
  function tx(m){ return PAD.left + (m/TLW)*CW }
  function ty(q){ return PAD.top  + CH - (q/maxY)*CH }

  // ── Grid lines ────────────────────────────────────
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (var xi=0; xi<=5; xi++) {
    var gx = tx(xi*60);
    ctx.beginPath(); ctx.moveTo(gx, PAD.top); ctx.lineTo(gx, PAD.top+CH); ctx.stroke();
  }
  for (var yi=0; yi<=4; yi++) {
    var gy = PAD.top + (yi/4)*CH;
    ctx.beginPath(); ctx.moveTo(PAD.left, gy); ctx.lineTo(PAD.left+CW, gy); ctx.stroke();
  }

  // ── Flight zone shading ───────────────────────────
  if (dep < TLW) {
    ctx.fillStyle = 'rgba(0,180,255,0.07)';
    ctx.fillRect(tx(dep), PAD.top, tx(Math.min(lnd,TLW))-tx(dep), CH);
    ctx.strokeStyle = 'rgba(0,180,255,0.25)';
    ctx.setLineDash([4,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(tx(dep),PAD.top); ctx.lineTo(tx(dep),PAD.top+CH); ctx.stroke();
    if (lnd < TLW) {
      ctx.beginPath(); ctx.moveTo(tx(lnd),PAD.top); ctx.lineTo(tx(lnd),PAD.top+CH); ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // ── Stock window shading ──────────────────────────
  if (rst!=null && dur && rst<TLW) {
    ctx.fillStyle = 'rgba(0,255,136,0.06)';
    ctx.fillRect(tx(rst), PAD.top, tx(Math.min(rst+dur,TLW))-tx(rst), CH);
  }

  // ── Stock line ────────────────────────────────────
  if (pts.length > 1) {
    // Gradient fill under line
    var grad = ctx.createLinearGradient(0, PAD.top, 0, PAD.top+CH);
    grad.addColorStop(0,  'rgba(0,255,136,0.25)');
    grad.addColorStop(1,  'rgba(0,255,136,0.01)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(tx(pts[0][0]), PAD.top+CH);
    pts.forEach(function(p){ ctx.lineTo(tx(p[0]), ty(p[1])); });
    ctx.lineTo(tx(pts[pts.length-1][0]), PAD.top+CH);
    ctx.closePath(); ctx.fill();

    // Line
    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach(function(p,i){ i===0 ? ctx.moveTo(tx(p[0]),ty(p[1])) : ctx.lineTo(tx(p[0]),ty(p[1])) });
    ctx.stroke();
  }

  // ── Marker helper ─────────────────────────────────
  function marker(t, label, color, yOff, dashed) {
    if (t < 0 || t > TLW) return;
    var x = tx(t);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    if (dashed) ctx.setLineDash([3,3]); else ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x, PAD.top); ctx.lineTo(x, PAD.top+CH); ctx.stroke();
    ctx.setLineDash([]);

    // Diamond marker at top
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, PAD.top-2);
    ctx.lineTo(x+5, PAD.top+5);
    ctx.lineTo(x, PAD.top+12);
    ctx.lineTo(x-5, PAD.top+5);
    ctx.closePath(); ctx.fill();

    // Label
    ctx.fillStyle = color;
    ctx.font = 'bold 8px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(label, x, PAD.top+CH+yOff);
  }

  // ── Event markers ─────────────────────────────────
  marker(0,   'NOW',  '#ffe000', 12, false);
  if (dep > 0 && dep < TLW) marker(dep, 'DEP', '#00b4ff', 12, false);
  if (lnd < TLW)             marker(lnd, 'LND', '#bf5fff', 24, false);
  if (rst!=null && rst<TLW)  marker(rst, 'RST', '#00ff88', 12, true);
  if (rst!=null && dur && (rst+dur)<TLW) marker(rst+dur, 'OUT', '#ff2d55', 24, true);

  // ── Axes ──────────────────────────────────────────
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(PAD.left, PAD.top); ctx.lineTo(PAD.left, PAD.top+CH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PAD.left, PAD.top+CH); ctx.lineTo(PAD.left+CW, PAD.top+CH); ctx.stroke();

  // ── Y axis labels ─────────────────────────────────
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '6px "Press Start 2P", monospace';
  ctx.textAlign = 'right';
  for (var yi2=0; yi2<=4; yi2++) {
    var qv = Math.round(maxY * (1 - yi2/4));
    ctx.fillText(qv > 999 ? Math.round(qv/1000)+'k' : qv, PAD.left-5, PAD.top + (yi2/4)*CH + 3);
  }

  // ── X axis labels ─────────────────────────────────
  ctx.textAlign = 'center';
  for (var xi2=0; xi2<=5; xi2++) {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '6px "Press Start 2P", monospace';
    ctx.fillText('+'+xi2+'h', tx(xi2*60), PAD.top+CH+10);
  }

  // ── Axis titles ───────────────────────────────────
  ctx.save();
  ctx.translate(11, PAD.top + CH/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillStyle='rgba(0,255,136,0.5)';
  ctx.font='6px "Press Start 2P", monospace';
  ctx.textAlign='center';
  ctx.fillText('STOCK QTY', 0, 0);
  ctx.restore();
  ctx.fillStyle='rgba(0,255,136,0.5)';
  ctx.font='6px "Press Start 2P", monospace';
  ctx.textAlign='center';
  ctx.fillText('TIME', PAD.left+CW/2, H-2);
}

// ── Card builder ────────────────────────────────────────────────────────────
var cardCounter = 0;
function buildCard(cc, name, p) {
  var m=CC[cc];
  var fly=p&&p.fly, theme, badge, bcls;
  if (!p)          { theme='theme-load'; badge='LOADING...';   bcls='b-load' }
  else if(fly===true) { theme='theme-fly';  badge='&#9654; FLY'; bcls='b-fly'  }
  else if(fly===false){ theme='theme-skip'; badge='&#9632; SKIP';bcls='b-skip' }
  else             { theme='theme-none'; badge='? NO DATA';    bcls='b-none' }

  if (p && fly===false && p.nextWindowMins > 0) { theme='theme-wait'; }

  var a=p&&p.analysis||{};
  var conf=p&&p.confidence||0, cp=Math.round(conf*100);
  var cfcol=cp>70?'#00ff88':cp>40?'#ffe000':'#ff2d55';
  var rst=p&&p.restockEta, nw=p&&p.nextWindowMins;
  var cid='chart_'+(++cardCounter)+'_'+cc+'_'+name.replace(/\W/g,'_');

  var flyColor = fly===true?'good':fly===false?'bad':'';

  return '<div class="card '+theme+'">' +
    '<div class="chead">' +
      '<div>' +
        '<div class="cname '+m.cls+'">'+name.toUpperCase()+'</div>' +
        '<div class="ccountry">'+m.n.toUpperCase()+' &bull; '+m.ft+'m FLIGHT</div>' +
      '</div>' +
      '<div class="badge '+bcls+'">'+badge+'</div>' +
    '</div>' +
    '<div class="cbody">' +
      '<div class="stats">' +
        '<div class="stat"><div class="slbl">STOCK NOW</div><div class="sval">'+(a.currentStock!=null?a.currentStock:'?')+'</div></div>' +
        '<div class="stat"><div class="slbl">DEPLETION /MIN</div><div class="sval warn">'+(a.depletionRate!=null?a.depletionRate:'?')+'</div></div>' +
        '<div class="stat"><div class="slbl">RESTOCK ETA</div><div class="sval">'+(rst!=null?fm(rst):'?')+'</div></div>' +
        '<div class="stat"><div class="slbl">STOCK LASTS</div><div class="sval">'+(a.avgStockDuration?fm(a.avgStockDuration):'?')+'</div></div>' +
        '<div class="stat"><div class="slbl">INTERVAL</div><div class="sval">'+(a.avgRestockInterval?fm(a.avgRestockInterval):'?')+'</div></div>' +
        '<div class="stat"><div class="slbl">NEXT WINDOW</div><div class="sval '+flyColor+'">'+(nw!=null?fm(nw):'?')+'</div></div>' +
        '<div class="stat"><div class="slbl">DATA POINTS</div><div class="sval">'+(a.dataPoints||'?')+'</div></div>' +
        '<div class="stat"><div class="slbl">RESTOCKS OBS</div><div class="sval">'+(a.restockCount||'?')+'</div></div>' +
      '</div>' +
      '<div class="reason">'+(p&&p.reason||'FETCHING...')+'</div>' +
      '<div class="chart-title">&#128202; STOCK TIMELINE &mdash; 5 HOUR WINDOW</div>' +
      '<div class="chart-wrap"><canvas id="'+cid+'" style="width:100%;height:160px"></canvas></div>' +
      '<div class="conf-row">' +
        '<div class="conf-lbl">CONFIDENCE</div>' +
        '<div class="conf-track"><div class="conf-fill" style="width:'+cp+'%;background:'+cfcol+'"></div></div>' +
        '<div class="conf-pct">'+cp+'%</div>' +
      '</div>' +
    '</div>' +
  '</div>' +
  '<script>requestAnimationFrame(function(){drawChart("'+cid+'",'+JSON.stringify(p||null)+','+m.ft+')})<\/script>';
}

function fm(m){if(m===null||m===undefined)return'?';m=Math.round(m);return m<60?m+'m':Math.floor(m/60)+'h'+(m%60?m%60+'m':'')}

// ── Render charts ────────────────────────────────────────────────────────────
function renderCharts() {
  var area=document.getElementById('charts'), empty=document.getElementById('empty');
  var active=[];
  Object.keys(en).forEach(function(k){
    if(en[k]){
      var idx=k.indexOf('|'), cc=k.substring(0,idx), name=k.substring(idx+1);
      active.push({cc:cc,name:name});
    }
  });
  if(!active.length){area.innerHTML='';area.appendChild(empty);empty.style.display='flex';return}
  empty.style.display='none';
  area.innerHTML=active.map(function(x){return buildCard(x.cc,x.name,cache[ik(x.cc,x.name)]||null)}).join('');

  Promise.all(active.map(function(x){
    return fetch(PRED+'?token='+TOKEN+'&cc='+x.cc+'&item='+encodeURIComponent(x.name))
      .then(function(r){return r.ok?r.json():null})
      .then(function(d){if(d){cache[ik(x.cc,x.name)]=d}})
      .catch(function(){});
  })).then(function(){
    area.innerHTML=active.map(function(x){return buildCard(x.cc,x.name,cache[ik(x.cc,x.name)]||null)}).join('');
    var n=new Date();function p(v){return String(v).padStart(2,'0')}
    document.getElementById('lastref').textContent='LAST REFRESH: '+p(n.getUTCHours())+':'+p(n.getUTCMinutes())+' UTC';
  });
}

// ── Clock ───────────────────────────────────────────────────────────────────
function tick(){
  var n=new Date();function p(v){return String(v).padStart(2,'0')}
  document.getElementById('clock').innerHTML='<span class="blink">&#9608;</span> '+p(n.getUTCHours())+':'+p(n.getUTCMinutes())+':'+p(n.getUTCSeconds())+' UTC';
}
setInterval(tick,1000);tick();

// ── Countdown ───────────────────────────────────────────────────────────────
var cd=RS;
setInterval(function(){
  cd--;
  document.getElementById('fbar').style.width=((RS-cd)/RS*100).toFixed(1)+'%';
  document.getElementById('flbl').textContent='REFRESH: '+cd+'s';
  if(cd<=0){cd=RS;renderCharts()}
},1000);

// ── Category ────────────────────────────────────────────────────────────────
document.getElementById('cats').addEventListener('click',function(e){
  var b=e.target.closest('.cbtn');if(!b)return;
  cat=b.dataset.cat;
  document.querySelectorAll('.cbtn').forEach(function(x){x.classList.toggle('on',x===b)});
  renderSidebar();
});

// ── Init ────────────────────────────────────────────────────────────────────
load();renderSidebar();renderCharts();
</script>
