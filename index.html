<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORN STOCK TRACKER</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0a0a0f;
    --bg2:     #0d0d18;
    --green:   #00ff41;
    --cyan:    #00e5ff;
    --yellow:  #ffe600;
    --red:     #ff3131;
    --orange:  #ff8c00;
    --purple:  #cc00ff;
    --border:  #00ff4133;
    --text:    #b8f0b8;
    --dim:     #1a2a1a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    overflow-x: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content:'';
    position:fixed; inset:0; z-index:9999; pointer-events:none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px
    );
  }

  /* CRT vignette */
  body::after {
    content:'';
    position:fixed; inset:0; z-index:9998; pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
  }

  @keyframes blink    { 0%,100%{opacity:1} 49%{opacity:1} 50%{opacity:0} }
  @keyframes glow     { 0%,100%{text-shadow:0 0 6px var(--green),0 0 12px var(--green)} 50%{text-shadow:0 0 12px var(--green),0 0 30px var(--green),0 0 60px var(--green)} }
  @keyframes scan     { 0%{left:-100%} 100%{left:100%} }
  @keyframes flicker  { 0%,100%{opacity:1} 95%{opacity:0.97} 97%{opacity:0.92} 99%{opacity:0.97} }

  .blink { animation: blink 1s step-end infinite; }

  /* ── HEADER ─────────────────────────────────── */
  header {
    padding: 16px 20px 12px;
    border-bottom: 2px solid var(--green);
    background: var(--bg2);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
    animation: flicker 10s infinite;
  }
  .logo {
    color: var(--green);
    font-size: 13px;
    letter-spacing: 3px;
    animation: glow 4s ease-in-out infinite;
  }
  .logo span { color: var(--cyan); }
  .header-right { text-align: right; }
  #clock { color: var(--yellow); font-size: 9px; letter-spacing: 2px; }
  .subtitle { color: #3a7a3a; font-size: 6px; letter-spacing: 2px; margin-top: 4px; }

  /* ── LAYOUT ─────────────────────────────────── */
  .layout { display: flex; height: calc(100vh - 62px); }

  /* ── SIDEBAR ────────────────────────────────── */
  .sidebar {
    width: 210px; min-width: 210px;
    border-right: 2px solid var(--green);
    background: var(--bg2);
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .sidebar-section { padding: 10px; border-bottom: 1px solid var(--border); }
  .section-title {
    color: var(--yellow); font-size: 7px;
    letter-spacing: 2px; margin-bottom: 8px;
  }

  /* Category buttons */
  .cat-grid { display: flex; flex-wrap: wrap; gap: 4px; }
  .cat-btn {
    font-family: inherit; font-size: 6px;
    padding: 3px 6px; cursor: pointer;
    border: 1px solid var(--cyan); color: var(--cyan);
    background: transparent; letter-spacing: 1px;
    transition: all 0.05s;
  }
  .cat-btn:hover, .cat-btn.on { background: var(--cyan); color: var(--bg); }

  /* Country groups */
  .country-group { margin-bottom: 2px; }
  .country-hdr {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px; cursor: pointer;
    color: var(--orange); font-size: 6px; letter-spacing: 2px;
    border-left: 2px solid transparent;
    transition: border-color 0.1s;
  }
  .country-hdr:hover { border-left-color: var(--orange); color: var(--yellow); }
  .arrow { font-size: 5px; transition: transform 0.15s; display:inline-block; }
  .arrow.open { transform: rotate(90deg); }
  .flight-time { color: #3a4a6a; font-size: 5px; margin-left: auto; }

  .item-rows { padding: 0 8px 4px 18px; }
  .item-row {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 2px; cursor: pointer;
    font-size: 6px; color: var(--text);
    letter-spacing: 0.5px;
    transition: color 0.05s;
  }
  .item-row:hover { color: var(--green); }
  .item-row.hidden { display: none; }
  .chk {
    width: 10px; height: 10px; flex-shrink: 0;
    border: 1px solid var(--green); background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; line-height: 1;
  }
  .chk.on { background: var(--green); color: var(--bg); }

  /* ── CHARTS AREA ────────────────────────────── */
  .charts {
    flex: 1; overflow-y: auto;
    padding: 12px; background: var(--bg);
  }

  .empty {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; gap: 14px;
    color: #1a3a1a; text-align: center;
  }
  .empty-icon { font-size: 32px; }
  .empty p { font-size: 7px; line-height: 2.5; color: #2a5a2a; }

  /* Card */
  .card {
    border: 2px solid var(--green);
    background: var(--bg2);
    margin-bottom: 14px;
    position: relative; overflow: hidden;
  }
  .card-scan {
    position: absolute; top: 0; left: -100%; height: 2px; width: 60%;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    animation: scan 4s linear infinite;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; background: #050f05;
    border-bottom: 1px solid var(--border);
  }
  .card-name { color: var(--cyan); font-size: 8px; letter-spacing: 1px; }
  .card-country { color: #3a6a6a; font-size: 6px; margin-top: 2px; }

  .badge {
    font-size: 7px; padding: 3px 8px;
    border: 1px solid; letter-spacing: 1px; white-space: nowrap;
  }
  .b-fly    { color: var(--green);  border-color: var(--green);  background: #001800; }
  .b-skip   { color: var(--red);    border-color: var(--red);    background: #180000; }
  .b-nodata { color: var(--orange); border-color: var(--orange); background: #181000; }
  .b-load   { color: var(--yellow); border-color: var(--yellow); background: #181800; }

  .card-body { padding: 10px 12px; }

  /* Stats */
  .stats {
    display: flex; flex-wrap: wrap; gap: 12px 20px;
    margin-bottom: 8px;
  }
  .stat-lbl { color: #3a6a3a; font-size: 6px; letter-spacing: 1px; margin-bottom: 2px; }
  .stat-val { color: var(--yellow); font-size: 7px; }

  /* Reason */
  .reason {
    font-size: 6px; line-height: 2.2; color: var(--text);
    padding: 6px 8px; background: #030a03;
    border: 1px solid var(--border); margin-bottom: 10px;
    letter-spacing: 0.5px; word-break: break-word;
  }

  /* Confidence */
  .conf-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .conf-lbl { color: #3a6a3a; font-size: 6px; white-space: nowrap; }
  .conf-track {
    flex: 1; height: 8px; background: #0a0a0a;
    border: 1px solid var(--border); overflow: hidden;
  }
  .conf-fill { height: 100%; transition: width 0.5s; position: relative; }
  .conf-fill::after {
    content:''; position: absolute; right:0; top:0; bottom:0;
    width: 3px; background: rgba(255,255,255,0.5);
  }
  .conf-pct { color: var(--yellow); font-size: 7px; white-space: nowrap; }

  /* Timeline */
  .tl-lbl { color: #3a6a3a; font-size: 6px; letter-spacing: 1px; margin-bottom: 4px; }
  .tl {
    position: relative; height: 44px;
    background: #020802; border: 1px solid var(--border);
    overflow: hidden; margin-bottom: 4px;
  }
  .tl-zone { position: absolute; top: 6px; height: 26px; }
  .z-stock { background: rgba(0,255,65,0.15); border: 1px solid rgba(0,255,65,0.4); }
  .z-flight { background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.3); }
  .tl-mark { position: absolute; top: 0; height: 100%; width: 2px; }
  .tl-mark-line { position: absolute; top: 0; bottom: 14px; width: 2px; }
  .tl-mark-lbl { position: absolute; bottom: 1px; font-size: 5px; white-space: nowrap; transform: translateX(-50%); letter-spacing: 0.5px; }
  .m-now    .tl-mark-line { background: var(--yellow); }  .m-now    .tl-mark-lbl { color: var(--yellow); }
  .m-dep    .tl-mark-line { background: var(--cyan); }    .m-dep    .tl-mark-lbl { color: var(--cyan); }
  .m-land   .tl-mark-line { background: var(--purple); }  .m-land   .tl-mark-lbl { color: var(--purple); }
  .m-rst    .tl-mark-line { background: var(--green); }   .m-rst    .tl-mark-lbl { color: var(--green); }
  .m-dep2   .tl-mark-line { background: var(--red); }     .m-dep2   .tl-mark-lbl { color: var(--red); }

  .tl-scale { display: flex; justify-content: space-between; color: #2a5a2a; font-size: 5px; }

  /* Legend */
  .legend {
    display: flex; gap: 12px; flex-wrap: wrap;
    padding: 6px 12px; background: var(--bg2);
    border-top: 2px solid var(--green); font-size: 6px;
  }
  .leg { display: flex; align-items: center; gap: 4px; }
  .leg-dot { width: 8px; height: 8px; border: 1px solid; flex-shrink: 0; }

  /* Footer refresh */
  .footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 4px; background: #050f05;
    border-top: 1px solid var(--border);
    z-index: 100;
  }
  .footer-bar { height: 100%; background: var(--green); transition: width 1s linear; }
  .footer-lbl {
    position: fixed; bottom: 7px; right: 10px;
    font-size: 6px; color: #2a5a2a; letter-spacing: 1px;
    z-index: 101;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--green); border-radius: 0; }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">▶ TORN <span>STOCK</span> TRACKER</div>

</header>

<div class="legend">

  <div class="leg"><div class="leg-dot" style="background:var(--red);border-color:var(--red)"></div><span style="color:var(--red)">DEPLETES</span></div>
  <div class="leg"><div class="leg-dot" style="background:rgba(0,229,255,0.2);border-color:var(--cyan)"></div><span style="color:var(--cyan)">IN-FLIGHT</span></div>
  <div class="leg"><div class="leg-dot" style="background:rgba(0,255,65,0.2);border-color:var(--green)"></div><span style="color:var(--green)">STOCK WINDOW</span></div>
</div>

<div class="footer"><div class="footer-bar" id="footerBar" style="width:0%"></div></div>
<div class="footer-lbl" id="footerLbl">REFRESH: 60s</div>

<script>
const TOKEN       = 'v3CWFEDg24av';
const PREDICT_URL = '/api/predict';
const REFRESH_S   = 60;
const TL_WINDOW   = 300; // 5h timeline window

const CC = {

const ITEMS = {

        {n:'Diamond Bladed Knife',c:'weapon'},{n:'Tavor TAR-21',c:'weapon'},{n:'Bearer Bond',c:'other'}],
  can: [{n:'Wolverine Plushie',c:'plushie'},{n:'Crocus',c:'flower'},{n:'Xanax',c:'drug'},
        {n:'Cannabis',c:'drug'},{n:'Vicodin',c:'drug'},{n:'Ecstasy',c:'drug'},
        {n:'PCP',c:'drug'},{n:'Insulin',c:'drug'},{n:'Bear Gall',c:'other'},
        {n:'Hockey Stick',c:'weapon'},{n:'Quartz Point',c:'other'}],
  haw: [{n:'Orchid',c:'flower'},{n:'Pele Charm',c:'other'},{n:'Small Suitcase',c:'other'},
        {n:'Medium Suitcase',c:'other'},{n:'Large Suitcase',c:'other'},{n:'Shark Fin',c:'other'},
        {n:'Turtle Shell',c:'other'},{n:'Basalt Point',c:'other'},
        {n:'Type 98 Anti Tank',c:'weapon'},{n:'Bushmaster Carbon 15',c:'weapon'},{n:'Taurus',c:'weapon'}],
  uni: [{n:'Heather',c:'flower'},{n:'Red Fox Plushie',c:'plushie'},{n:'Nessie Plushie',c:'plushie'},
        {n:'Xanax',c:'drug'},{n:'Cannabis',c:'drug'},{n:'Vicodin',c:'drug'},
        {n:'Ecstasy',c:'drug'},{n:'PCP',c:'drug'},{n:'Ketamine',c:'drug'},{n:'Shrooms',c:'drug'},
        {n:'Enfield SA-80',c:'weapon'},{n:'Grenade',c:'weapon'},{n:'Claymore Sword',c:'weapon'}],
  arg: [{n:'Ceibo Flower',c:'flower'},{n:'Monkey Plushie',c:'plushie'},{n:'Cannabis',c:'drug'},
        {n:'LSD',c:'drug'},{n:'Ketamine',c:'drug'},{n:'Shrooms',c:'drug'},{n:'Speed',c:'drug'},
        {n:'Flamethrower',c:'weapon'},{n:'Liquid Body Armor',c:'weapon'},
        {n:'Meteorite Fragment',c:'other'},{n:'Patagonian Fossil',c:'other'},{n:'Chalcedony Point',c:'other'}],
  swi: [{n:'Edelweiss',c:'flower'},{n:'Chamois Plushie',c:'plushie'},{n:'Cannabis',c:'drug'},
        {n:'LSD',c:'drug'},{n:'Ketamine',c:'drug'},{n:'Shrooms',c:'drug'},{n:'Speed',c:'drug'},
        {n:'PCP',c:'drug'},{n:'Neumune Tablet',c:'drug'},{n:'Ephedrine Powder',c:'drug'},
        {n:'Safrole Oil',c:'drug'},{n:'Ergotamine Ampoule',c:'drug'},
        {n:'SIG 552',c:'weapon'},{n:'Jackhammer',c:'weapon'},{n:'Swiss Army Knife',c:'weapon'}],
  jap: [{n:'Cherry Blossom',c:'flower'},{n:'Xanax',c:'drug'},{n:'Ketamine',c:'drug'},
        {n:'Vicodin',c:'drug'},{n:'Ecstasy',c:'drug'},{n:'Speed',c:'drug'},{n:'Shrooms',c:'drug'},
        {n:'Opium',c:'drug'},{n:'Kabuki Mask',c:'other'},{n:'Maneki Neko',c:'other'},
        {n:'Sumo Doll',c:'plushie'},{n:'BT MP9',c:'weapon'},{n:'Metal Nunchakus',c:'weapon'},
        {n:'Kodachi',c:'weapon'},{n:'Flexible Body Armor',c:'weapon'},{n:'Counterfeit Manga',c:'other'}],
  chi: [{n:'Peony',c:'flower'},{n:'Panda Plushie',c:'plushie'},{n:'Ecstasy',c:'drug'},
        {n:'LSD',c:'drug'},{n:'Speed',c:'drug'},{n:'PCP',c:'drug'},{n:'Opium',c:'drug'},
        {n:'Katana',c:'weapon'},{n:'SKS Carbine',c:'weapon'},{n:'Jade Buddha',c:'other'},
        {n:'Pangolin Scales',c:'other'},{n:'Tiger Bone Powder',c:'other'}],
  uae: [{n:'Tribulus Omanense',c:'flower'},{n:'Camel Plushie',c:'plushie'},
        {n:'Gold Laptop',c:'other'},{n:'Gold Plated AK-47',c:'weapon'},{n:'Pink Mac-10',c:'weapon'},
        {n:'Natural Pearls',c:'other'},{n:'Ambergris Lump',c:'other'},{n:'Sports Shades',c:'other'},
        {n:'Potassium Nitrate',c:'other'}],
  sou: [{n:'African Violet',c:'flower'},{n:'Lion Plushie',c:'plushie'},{n:'Xanax',c:'drug'},
        {n:'PCP',c:'drug'},{n:'LSD',c:'drug'},{n:'Shrooms',c:'drug'},{n:'Opium',c:'drug'},
        {n:'Vektor CR-21',c:'weapon'},{n:'Mag 7',c:'weapon'},{n:'Spear',c:'weapon'},
        {n:'Uncut Diamonds',c:'other'},{n:'Quartzite Point',c:'other'}],
};

// ── State ─────────────────────────────────────
let enabled   = {};
let collapsed = {};
let cat       = 'all';
let cache     = {};

function save() { localStorage.setItem('tst_v3', JSON.stringify({enabled, collapsed})); }
function load() {
  try { const s = JSON.parse(localStorage.getItem('tst_v3')||'{}'); enabled=s.enabled||{}; collapsed=s.collapsed||{}; }
  catch(e) { enabled={}; collapsed={}; }
}
function ikey(cc,n) { return `${cc}||${n}`; }

// ── Sidebar ───────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('countryList');
  list.innerHTML = '';
  for (const [cc, items] of Object.entries(ITEMS)) {
    const visible = items.filter(i => cat==='all' || i.c===cat);
    if (!visible.length) continue;
    const meta = CC[cc];
    const open = !collapsed[cc];
    const g = document.createElement('div');
    g.className = 'country-group';

    const hdr = document.createElement('div');
    hdr.className = 'country-hdr';
    hdr.innerHTML = `<span class="arrow ${open?'open':''}">▶</span>${meta.name.toUpperCase()}<span class="flight-time">${meta.ft}M</span>`;
    hdr.onclick = () => { collapsed[cc]=!collapsed[cc]; save(); renderSidebar(); };

    const rows = document.createElement('div');
    rows.className = 'item-rows';
    rows.style.display = open ? 'block' : 'none';

    visible.forEach(item => {
      const k = ikey(cc, item.n);
      const on = !!enabled[k];
      const r = document.createElement('div');
      r.className = 'item-row';
      r.innerHTML = `<div class="chk ${on?'on'}">${on?'✓':''}</div>${item.n}`;
      r.onclick = () => { enabled[k]=!enabled[k]; save(); renderSidebar(); renderCharts(); };
      rows.appendChild(r);
    });

    g.appendChild(hdr);
    g.appendChild(rows);
    list.appendChild(g);
  }
}

// ── Chart helpers ─────────────────────────────
function fm(m) {
  if (m===null||m===undefined) return '?';
  m = Math.round(m);
  return m < 60 ? `${m}m` : `${Math.floor(m/60)}h${m%60?m%60+'m':''}`;
}

function pct(m) { return Math.max(0, Math.min(100, (m/TL_WINDOW)*100)).toFixed(2); }

function buildTL(pred, ft) {
  const a   = pred.analysis || {};
  const rst = pred.restockEta;
  const dur = a.avgStockDuration;
  const nw  = pred.nextWindowMins || 0;
  const dep = nw;
  const lnd = dep + ft;
  let html  = '';

  // stock zone
  if (rst!=null && dur) {
    html += `<div class="tl-zone z-stock" style="left:${pct(rst)}%;width:${pct(rst+dur)-pct(rst)}%"></div>`;
  }
  // flight zone
  if (dep < TL_WINDOW) {
    html += `<div class="tl-zone z-flight" style="left:${pct(dep)}%;width:${Math.max(0.5,pct(lnd)-pct(dep))}%"></div>`;
  }

  const marks = [{p:0,cls:'m-now',lbl:'NOW'}];
  if (dep > 0 && dep < TL_WINDOW)         marks.push({p:dep, cls:'m-dep', lbl:`DEP ${fm(dep)}`});
  if (lnd < TL_WINDOW)                    marks.push({p:lnd, cls:'m-land',lbl:`LND ${fm(lnd)}`});
  if (rst!=null && rst < TL_WINDOW)       marks.push({p:rst, cls:'m-rst', lbl:`RST ${fm(rst)}`});
  if (rst!=null && dur && (rst+dur)<TL_WINDOW) marks.push({p:rst+dur,cls:'m-dep2',lbl:`OUT ${fm(rst+dur)}`});

  marks.forEach(m => {
    html += `<div class="tl-mark ${m.cls}" style="left:${pct(m.p)}%">
      <div class="tl-mark-line"></div>
      <div class="tl-mark-lbl">${m.lbl}</div>
    </div>`;
  });
  return html;
}

function buildCard(cc, name, pred) {
  const meta = CC[cc];
  const id   = `card_${cc}_${name.replace(/[\s&]/g,'_')}`;
  let badge, bcls;
  if (!pred)               { badge='LOADING'; bcls='b-load'; }
  else if (pred.fly===true){ badge='▶ FLY';   bcls='b-fly'; }
  else if (pred.fly===false){ badge='■ SKIP'; bcls='b-skip'; }
  else                     { badge='? NO DATA';bcls='b-nodata'; }

  const a    = pred?.analysis || {};
  const conf = pred?.confidence || 0;
  const cp   = Math.round(conf*100);
  const cfcol= cp>70?'var(--green)':cp>40?'var(--yellow)':'var(--red)';
  const rst  = pred?.restockEta;
  const nw   = pred?.nextWindowMins;
  const reason = pred?.reason || 'FETCHING...';

  return `<div class="card" id="${id}">
  <div class="card-scan"></div>
  <div class="card-head">
    <div>
      <div class="card-name">${name.toUpperCase()}</div>
      <div class="card-country">▶ ${meta.name.toUpperCase()} | FLIGHT: ${meta.ft}m</div>
    </div>
    <div class="badge ${bcls}">${badge}</div>
  </div>
  <div class="card-body">
    <div class="stats">
      <div><div class="stat-lbl">STOCK NOW</div><div class="stat-val">${a.currentStock??'?'}</div></div>
      <div><div class="stat-lbl">DEPLETION</div><div class="stat-val">${a.depletionRate!=null?a.depletionRate+'/m':'?'}</div></div>
      <div><div class="stat-lbl">RESTOCK ETA</div><div class="stat-val">${fm(rst)}</div></div>
      <div><div class="stat-lbl">STOCK LASTS</div><div class="stat-val">${fm(a.avgStockDuration)}</div></div>
      <div><div class="stat-lbl">INTERVAL</div><div class="stat-val">${fm(a.avgRestockInterval)}</div></div>
      <div><div class="stat-lbl">NEXT WINDOW</div><div class="stat-val" style="color:${pred?.fly?'var(--green)':'var(--orange)'}">${fm(nw)}</div></div>
      <div><div class="stat-lbl">DATA PTS</div><div class="stat-val">${a.dataPoints??'?'}</div></div>
      <div><div class="stat-lbl">RESTOCKS</div><div class="stat-val">${a.restockCount??'?'}</div></div>
    </div>
    <div class="reason">${reason}</div>
    <div class="conf-row">
      <div class="conf-lbl">CONFIDENCE</div>
      <div class="conf-track"><div class="conf-fill" style="width:${cp}%;background:${cfcol}"></div></div>
      <div class="conf-pct">${cp}%</div>
    </div>
    <div class="tl-lbl">TIMELINE (5H WINDOW)</div>
    <div class="tl">${pred ? buildTL(pred, meta.ft) : '<div style="padding:12px;color:#1a4a1a;font-size:6px">LOADING...</div>'}</div>
    <div class="tl-scale"><span>NOW</span><span>+1h</span><span>+2h</span><span>+3h</span><span>+4h</span><span>+5h</span></div>
  </div>
</div>`;
}

// ── Charts renderer ───────────────────────────
async function renderCharts() {
  const area  = document.getElementById('charts');
  const empty = document.getElementById('empty');

  const active = Object.entries(enabled)
    .filter(([,v])=>v)
    .map(([k])=>{ const [cc,...r]=k.split('||'); return {cc, name:r.join('||')}; });

  if (!active.length) {
    area.innerHTML = '';
    area.appendChild(empty);
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  // Render loading state with cached data if available
  area.innerHTML = active.map(({cc,name}) => buildCard(cc, name, cache[ikey(cc,name)]||null)).join('');

  // Fetch all in parallel
  await Promise.all(active.map(async ({cc, name}) => {
    try {
      const r = await fetch(`${PREDICT_URL}?token=${TOKEN}&cc=${cc}&item=${encodeURIComponent(name)}`);
      if (r.ok) { cache[ikey(cc,name)] = await r.json(); }
    } catch(e) {}
  }));

  // Re-render with real data
  area.innerHTML = active.map(({cc,name}) => buildCard(cc, name, cache[ikey(cc,name)]||null)).join('');

  // Update last refresh time
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('lastRefresh').textContent =
    `LAST REFRESH: ${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())} UTC`;
}

// ── Clock ─────────────────────────────────────
function updateClock() {
  const n=new Date(), p=v=>String(v).padStart(2,'0');
  document.getElementById('clock').innerHTML =
    `<span class="blink">█</span> ${p(n.getUTCHours())}:${p(n.getUTCMinutes())}:${p(n.getUTCSeconds())} UTC`;
}

// ── Refresh countdown ─────────────────────────
let countdown = REFRESH_S;
setInterval(() => {
  countdown--;
  const pct = ((REFRESH_S - countdown) / REFRESH_S * 100).toFixed(1);
  document.getElementById('footerBar').style.width = pct + '%';
  document.getElementById('footerLbl').textContent = `REFRESH: ${countdown}s`;
  if (countdown <= 0) { countdown = REFRESH_S; renderCharts(); }
}, 1000);

// ── Category ──────────────────────────────────
document.getElementById('catGrid').addEventListener('click', e => {
  const btn = e.target.closest('.cat-btn');
  if (!btn) return;
  cat = btn.dataset.cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('on', b===btn));
  renderSidebar();
});

// ── Init ──────────────────────────────────────
setInterval(updateClock, 1000);
updateClock();
load();
renderSidebar();
renderCharts();
</script>
